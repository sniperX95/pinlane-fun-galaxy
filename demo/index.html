     qu'il regarde. -->

<body>
<!-- ==========================================================================
     LA DEMONSTRATION EST UN OBJET AUTONOME (2026-08-13).
     ==========================================================================
     Elle ne charge AUCUN script de l'application : ni `app-main.js`, ni
     `staff-pages-v2.js`, ni `pinlane-staff.css`. Elle ne parle a aucune API,
     elle ne touche aucune base, elle n'ecrit dans aucun stockage.

     Pourquoi ce decouplage, decide par Movsar : « c'est une demo, un truc a
     part, et ca ne doit pas du tout etre branche avec le vrai ». Consequence
     directe et voulue : aucun effet ajoute ici pour seduire un prospect ne
     peut atterrir sur l'ecran d'un gerant, et aucun defaut d'ici ne peut
     toucher la production.

     LE REVERS EST TRAITE. Une maquette decouplee derive : elle finit par
     montrer des ecrans que le produit ne fait plus. C'est arrive trois fois
     sur la vitrine le meme jour. L'antidote est un gate,
     `npm run test:demo-fidelity`, qui ouvre la VRAIE console et cette page, et
     compare ce qui est verifiable : la liste et l'ordre des entrees de menu,
     les libelles d'ecran, les intitules d'indicateurs, d'onglets et de
     filtres. Il rougit des que le produit bouge sans que cette page suive.
     ========================================================================== -->

    </button>
