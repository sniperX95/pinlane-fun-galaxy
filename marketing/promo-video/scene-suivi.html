<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Pinlane - on suit une reservation</title>
<link rel="stylesheet" href="../../assets/pinlane.css">
<style>
  /* Scene dessinee en 2560x1440 CSS, rendue avec --scale 1.5 -> 3840x2160.
     Parti pris : CARRE. Pas de flottement sinusoidal, pas d'element qui bouge
     « pour bouger ». Tout est aligne sur une grille, tout mouvement va d'un
     point A a un point B sur un axe. C'est ce qui separe un film produit d'une
     animation generique. */
  @font-face { font-family:'Geist'; src:url('../../assets/fonts/geist-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  @font-face { font-family:'Geist Mono'; src:url('../../assets/fonts/geist-mono-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden;background:#04060b}
  body{font-family:var(--font-ui);color:#fff;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:2560px;height:1440px;overflow:hidden;background:#05070c;
    perspective:3000px}

  /* Fond : une seule nappe froide, tres basse. Pas de boules de couleur qui
     derivent — c'est la signature « fond d'ecran IA ». */
  #wash{position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%,rgba(24,58,110,.55),transparent 62%),
               radial-gradient(90% 70% at 50% 110%,rgba(12,30,62,.5),transparent 60%)}
  #rule{position:absolute;inset:0;opacity:.055;
    background-image:linear-gradient(90deg,rgba(140,180,240,.9) 1px,transparent 1px);
    background-size:160px 100%}

  /* Reperes de cadrage aux quatre coins : vocabulaire technique, pas decoratif. */
  .corner{position:absolute;width:56px;height:56px;border:2px solid rgba(255,255,255,.20)}
  #cTL{left:70px;top:70px;border-right:0;border-bottom:0}
  #cTR{right:70px;top:70px;border-left:0;border-bottom:0}
  #cBL{left:70px;bottom:70px;border-right:0;border-top:0}
  #cBR{right:70px;bottom:70px;border-left:0;border-top:0}

  .card{position:absolute;border-radius:20px;overflow:hidden;background:#080a0e;
    border:1px solid rgba(255,255,255,.14);will-change:transform,opacity;
    box-shadow:0 60px 160px rgba(0,0,0,.92), 0 0 0 1px rgba(255,255,255,.04)}
  .card video{position:absolute;display:block}
  .card::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 40%,rgba(4,6,11,.34))}

  /* Le repere qui DESIGNE un element de l'interface. Ses coordonnees sont
     calculees depuis la position reelle mesuree dans l'application, pas posees
     a l'oeil. */
  .mark{position:absolute;border:3px solid var(--accent);border-radius:10px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 40px rgba(50,145,255,.55);
    pointer-events:none;will-change:opacity,transform}
  .mark .tag{position:absolute;left:0;top:-52px;background:var(--accent);color:#fff;
    font-size:26px;font-weight:700;padding:8px 18px;border-radius:8px;white-space:nowrap}

  .kick{position:absolute;font-family:var(--font-data);letter-spacing:.34em;
    text-transform:uppercase;font-size:24px;color:rgba(120,175,255,.95)}
  .ttl{position:absolute;font-weight:600;letter-spacing:-.035em;line-height:1.05;
    text-shadow:0 8px 40px rgba(0,0,0,.9);will-change:transform,opacity}
  /* Filet sous le titre : l'ancrage typographique du « carre ». */
  .bar{position:absolute;height:3px;background:var(--accent);will-change:transform}

  #subs{position:absolute;left:200px;right:200px;bottom:118px;text-align:center}
  .w{display:inline-block;font-size:72px;line-height:1.12;font-weight:600;letter-spacing:-.03em;
    margin:0 14px 2px 0;color:rgba(255,255,255,.96);text-shadow:0 6px 34px rgba(0,0,0,1)}
  .w.hi{color:#6cb0ff}

  /* Reglette de progression : le film se sait fini, c'est un detail de serieux. */
  #prog{position:absolute;left:70px;right:70px;bottom:52px;height:2px;background:rgba(255,255,255,.10)}
  #progIn{position:absolute;left:0;top:0;bottom:0;background:rgba(120,175,255,.85);width:0}

  .badge{position:absolute;right:150px;top:82px;font-family:var(--font-data);
    font-size:24px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.34)}

  .logo{position:absolute;left:50%;top:560px;transform:translateX(-50%);display:flex;align-items:center;gap:32px}
  .logo .m{width:124px;height:124px;border-radius:34px;background:var(--accent);position:relative}
  .logo .m::after{content:'';position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:13px;background:#05070c}
  .logo .t{font-size:136px;font-weight:600;letter-spacing:-.05em}
  .cta{position:absolute;left:50%;top:830px;transform:translateX(-50%);
    background:var(--accent);color:#fff;font-size:52px;font-weight:700;
    padding:36px 84px;border-radius:14px;white-space:nowrap;
    box-shadow:0 36px 100px rgba(50,145,255,.55)}

  #vig{position:absolute;inset:0;z-index:50;pointer-events:none;
    background:radial-gradient(135% 100% at 50% 46%,transparent 52%,rgba(0,0,0,.78) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="wash"></div>
  <div id="rule"></div>
  <div class="corner" id="cTL"></div><div class="corner" id="cTR"></div>
  <div class="corner" id="cBL"></div><div class="corner" id="cBR"></div>
  <div class="badge" id="badge">Pinlane</div>
  <div id="scene"></div>
  <div id="subs"></div>
  <div id="prog"><div id="progIn"></div></div>
  <div id="vig"></div>
</div>

<script>
// ===========================================================================
// LE FILM SUIT UNE RESERVATION, DU CLIENT JUSQU'A LA RELANCE.
//
// Les bornes des plans sortent de `ffmpeg silencedetect` sur voix-v3.mp3 :
//   0.00-1.26  Une reservation arrive.
//   1.59-3.07  Elle se pose dans votre planning.
//   3.66-5.12  La confirmation part toute seule.
//   5.57-7.12  Le rappel avant la venue aussi.
//   7.84-9.18  Et la relance des clients dormants.
//   9.50-10.56 Vous n'avez rien fait.
//   11.37-12.31 Pinlane, si.
//   12.74-13.76 Demandez votre demo.
// Chaque phrase a son plan, et les trois sequences citees sont DESIGNEES a
// l'ecran a leur position reelle.
// ===========================================================================
const DUR = 14.4;
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eQuint = (x) => 1 - Math.pow(1 - x, 5);
const lerp = (a, b, x) => a + (b - a) * x;

const LINES = [
  { a: 0.02, b: 1.50, t: 'Une réservation arrive.' },
  { a: 1.59, b: 3.58, t: 'Elle se pose dans votre planning.', hi: ['planning.'] },
  { a: 3.66, b: 5.49, t: 'La confirmation part toute seule.', hi: ['confirmation'] },
  { a: 5.57, b: 7.76, t: 'Le rappel avant la venue aussi.', hi: ['rappel'] },
  { a: 7.84, b: 9.42, t: 'Et la relance des clients dormants.', hi: ['relance'] },
  // sub:false — cette phrase est deja ecrite en grand DANS le plan a6 ; la
  // repeter en sous-titre l'affichait deux fois a l'ecran.
  { a: 9.50, b: 11.29, t: "Vous n'avez rien fait.", sub: false },
  { a: 11.37, b: 12.66, t: 'Pinlane, si.', hi: ['Pinlane,'] },
  { a: 12.74, b: 14.4, t: 'Demandez votre démo.', hi: ['démo.'] },
];

const ACTS = [
  ['a1',  0.00,  1.59], ['a2',  1.59,  3.66], ['a3',  3.66,  5.57],
  ['a4',  5.57,  7.84], ['a5',  7.84,  9.50], ['a6',  9.50, 11.37],
  ['a7', 11.37, 12.74], ['a8', 12.74, DUR],
];
const curAct = (t) => ACTS.find(([, a, b]) => t >= a && t < b) || ACTS[ACTS.length - 1];

const CLIP = { staff: '../../artifacts/promo-clips/staff.webm', client: '../../artifacts/promo-clips/client.webm' };
const SRC_W = 2560, SRC_H = 1440;   // definition native des captures

// Position REELLE des sequences dans l'application, relevee au navigateur
// (scripts de mesure : voir journal). La rangee de 6 cartes va de x=640 a
// x=2158, en y=590..804. On ne cadre pas a l'oeil : on pointe les coordonnees.
// Le format de la region doit suivre celui de la carte (1960/700 = 2,8) :
// sinon le cadrage « couvre » par la hauteur et rogne les cotes — les deux
// dernieres sequences, dont « Reactiver les dormants », sortaient du champ.
const ROW = { x: 620, y: 400, w: 1570, h: 561 };
const SEQ = {
  confirmation: { x: 900, y: 588, w: 246, h: 218, tag: 'Confirmation' },
  rappel:       { x: 1152, y: 588, w: 246, h: 218, tag: 'Rappel avant la venue' },
  dormants:     { x: 1906, y: 588, w: 252, h: 218, tag: 'Réactiver les dormants' },
};

let built = '';
function build(key, html) {
  if (built === key) return;
  $('scene').innerHTML = html;
  built = key;
  $('scene').querySelectorAll('video').forEach((v) => { v.muted = true; v.preload = 'auto'; v.load(); });
}

let WAIT = [];
function seekTo(v, time) {
  WAIT.push(v);
  const done = () => { WAIT = WAIT.filter((x) => x !== v); };
  v.addEventListener('seeked', done, { once: true });
  v.addEventListener('error', done, { once: true });
  try { v.currentTime = time; } catch (e) { done(); }
}
function scrub(sel, time) {
  const v = document.querySelector(sel);
  if (!v) return;
  if (v.readyState < 1) {
    WAIT.push(v);
    v.addEventListener('loadedmetadata', () => { WAIT = WAIT.filter((x) => x !== v); seekTo(v, time); }, { once: true });
    return;
  }
  if (Math.abs(v.currentTime - time) > 0.02) seekTo(v, time);
}
window.SCRUB_SETTLED = () => WAIT.length === 0
  && [...document.querySelectorAll('video')].every((v) => v.readyState >= 2 && !v.seeking);

// ---------------------------------------------------------------------------
// CADRAGE PAR COORDONNEES SOURCE.
// On ne dit pas « zoom 1,9 et decale un peu » : on dit « montre cette region
// de l'application, centree ». Le facteur d'echelle en decoule, et le meme
// facteur sert ensuite a poser les reperes au bon endroit.
// ---------------------------------------------------------------------------
const FRAMES = {};
function card(id, x, y, w, h, clip, focus) {
  // focus = region source a faire tenir dans la carte {x,y,w,h} ; par defaut
  // l'image entiere.
  const f = focus || { x: 0, y: 0, w: SRC_W, h: SRC_H };
  const s = Math.max(w / f.w, h / f.h);            // couvre la carte
  const vw = SRC_W * s;
  const left = w / 2 - (f.x + f.w / 2) * s;
  const top = h / 2 - (f.y + f.h / 2) * s;
  // x/y de la carte inclus : les reperes sont poses dans l'espace de la SCENE,
  // pas dans celui de la carte. Sans ce report, ils se dessinent en haut a
  // gauche, decales de la position de la carte.
  FRAMES[id] = { s, left, top, w, h, x, y };
  return `<div class="card" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <video id="${id}v" src="${clip}" style="width:${vw}px;left:${left}px;top:${top}px"></video></div>`;
}

// Repere sur un element de l'interface, place depuis ses coordonnees SOURCE.
function markHtml(cardId, id, rect, tag) {
  const F = FRAMES[cardId];
  if (!F) return '';
  const x = F.x + F.left + rect.x * F.s, y = F.y + F.top + rect.y * F.s;
  return `<div class="mark" id="${id}" style="left:${Math.round(x)}px;top:${Math.round(y)}px;
    width:${Math.round(rect.w * F.s)}px;height:${Math.round(rect.h * F.s)}px;opacity:0">
    <div class="tag">${tag}</div></div>`;
}

function place(id, opts) {
  const el = $(id); if (!el) return;
  const { p = 1, ry = 0, rx = 0, sc = 1, dx = 0, dy = 0 } = opts;
  el.style.opacity = p;
  el.style.transform = `translate3d(${dx}px, ${dy}px, 0) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`;
}

function reveal(id, t, a, dly, dur, dx) {
  const el = $(id); if (!el) return 0;
  const p = eOut(seg(t, a + dly, a + dly + dur));
  el.style.opacity = p;
  el.style.transform = `translateX(${lerp(dx, 0, p)}px)`;
  return p;
}

function drawScene(t) {
  const [key, a, b] = curAct(t);
  const d = seg(t, a, b);
  const settle = eQuint(seg(t, a, a + .34));   // arrivee franche, puis pose

  // ---- A1 : « Une reservation arrive. » --------------------------------
  if (key === 'a1') {
    build('b1', card('c1', 760, 300, 1180, 664, CLIP.client, { x: 700, y: 190, w: 1400, h: 788 })
      + `<div class="kick" id="k1" style="left:200px;top:470px">Cote client</div>
         <div class="bar" id="bar1" style="left:200px;top:516px;width:180px"></div>
         <div class="ttl" id="t1" style="left:200px;top:552px;font-size:78px;width:380px">Il réserve<br>en ligne.</div>`);
    scrub('#c1v', 2.2 + d * 3.4);
    place('c1', { ry: 5, rx: 1.5, sc: lerp(.965, 1, settle), dx: lerp(38, 0, settle), dy: lerp(10, -6, d) });
    reveal('k1', t, a, .05, .26, -30);
    reveal('t1', t, a, .12, .3, -30);
    const bar = $('bar1');
    if (bar) { const p = eOut(seg(t, a + .08, a + .42)); bar.style.opacity = p; bar.style.transform = `scaleX(${p})`; bar.style.transformOrigin = 'left'; }
  }

  // ---- A2 : « Elle se pose dans votre planning. » -----------------------
  if (key === 'a2') {
    build('b2', card('c1', 480, 210, 1600, 900, CLIP.staff)
      + `<div class="kick" id="k2" style="left:480px;top:130px">Cote centre</div>`);
    scrub('#c1v', 4.1 + d * 2.2);      // survol puis ouverture de la fiche
    place('c1', { ry: -3, rx: 1.2, sc: lerp(.972, 1, settle), dx: lerp(-34, 0, settle), dy: lerp(12, -8, d) });
    reveal('k2', t, a, .04, .24, -26);
  }

  // ---- A3 / A4 / A5 : les trois sequences, DESIGNEES une par une --------
  // Meme construction pour les trois : seul le repere se deplace. Aucun
  // remontage du DOM, donc aucune couture a risque entre ces plans.
  if (key === 'a3' || key === 'a4' || key === 'a5') {
    const html = card('c1', 300, 330, 1960, 700, CLIP.staff, ROW);
    build('b3', html
      + markHtml('c1', 'm1', SEQ.confirmation, SEQ.confirmation.tag)
      + markHtml('c1', 'm2', SEQ.rappel, SEQ.rappel.tag)
      + markHtml('c1', 'm3', SEQ.dormants, SEQ.dormants.tag)
      + `<div class="kick" id="k3" style="left:300px;top:230px">Séquences automatiques</div>
         <div class="bar" id="bar3" style="left:300px;top:280px;width:220px"></div>`);
    // Le curseur du clip se promene sur la rangee : le produit est manipule.
    const SHOT = { a3: [12.9, 14.3], a4: [15.0, 16.5], a5: [17.0, 18.5] }[key];
    scrub('#c1v', SHOT[0] + d * (SHOT[1] - SHOT[0]));
    place('c1', { sc: lerp(.99, 1.0, settle), dy: lerp(8, -6, d) });
    const k = $('k3'); if (k) k.style.opacity = 1;
    const bar = $('bar3'); if (bar) { bar.style.opacity = 1; bar.style.transform = 'scaleX(1)'; bar.style.transformOrigin = 'left'; }
    const actif = { a3: 'm1', a4: 'm2', a5: 'm3' }[key];
    ['m1', 'm2', 'm3'].forEach((id) => {
      const el = $(id); if (!el) return;
      if (id !== actif) { el.style.opacity = 0; return; }
      const p = eOut(seg(t, a + .04, a + .26));
      el.style.opacity = p;
      el.style.transform = `scale(${lerp(1.10, 1, p)})`;
    });
  }

  // ---- A6 : « Vous n'avez rien fait. » ---------------------------------
  // Plan large, calme, la carte recule. Le silence visuel porte la phrase.
  if (key === 'a6') {
    build('b6', card('c1', 700, 330, 1500, 844, CLIP.staff)
      + `<div class="ttl" id="t6" style="left:0;right:0;top:210px;text-align:center;font-size:92px;font-weight:600">Vous n'avez rien fait.</div>`);
    scrub('#c1v', 23.0 + d * 1.4);
    place('c1', { sc: lerp(.94, .90, d), dy: lerp(0, 26, d), p: lerp(1, .55, seg(t, a + .9, b)) });
    const el = $('t6');
    if (el) { const p = eOut(seg(t, a + .05, a + .34)); el.style.opacity = p; el.style.transform = `translateY(${lerp(26, 0, p)}px)`; }
  }

  // ---- A7 / A8 : la marque, puis l'appel a l'action --------------------
  if (key === 'a7' || key === 'a8') {
    build('b7', `<div class="logo" id="lg"><div class="m"></div><div class="t">Pinlane</div></div>
      <div class="cta" id="cb">Réserver une démo</div>`);
    const lg = $('lg'), cb = $('cb');
    const A7 = ACTS.find(([k]) => k === 'a7')[1];
    // Le logo arrive PLEIN des la premiere frame du plan : un fondu depuis zero
    // laissait une frame noire pile sur la revelation de marque (t=11,40).
    // Seule l'echelle est animee.
    if (lg) { const p = eQuint(seg(t, A7, A7 + .34)); lg.style.opacity = 1; lg.style.transform = `translateX(-50%) scale(${lerp(1.18, 1, p)})`; }
    if (cb) {
      const p = eOut(seg(t, 12.74, 13.05));      // arrive sur « Demandez »
      cb.style.opacity = p;
      cb.style.transform = `translateX(-50%) translateY(${lerp(26, 0, p)}px)`;
    }
  }
}

let subKey = '';
function drawSubs(t) {
  const L = LINES.find((l) => t >= l.a - .08 && t < l.b + .26);
  const host = $('subs');
  if (!L || L.sub === false) { host.style.opacity = 0; return; }
  if (subKey !== String(L.a)) {
    host.innerHTML = L.t.split(' ').map((w) => {
      const c = (L.hi || []).includes(w) ? ' hi' : '';
      return `<span class="w${c}">${w}</span>`;
    }).join('');
    subKey = String(L.a);
  }
  // Apparition par mot, mais SANS rebond : une pub serieuse ne fait pas
  // sautiller son texte.
  const words = [...host.children];
  const span = Math.max(.25, (L.b - L.a) * .55);
  words.forEach((el, i) => {
    const st = L.a + (i / Math.max(1, words.length)) * span;
    const p = eOut(clamp01(seg(t, st, st + .16)));
    el.style.opacity = p;
    el.style.transform = `translateY(${lerp(16, 0, p)}px)`;
  });
  const out = seg(t, L.b + .02, L.b + .24);
  host.style.opacity = 1 - out;
}

function render(t) {
  $('badge').style.opacity = .34;
  $('progIn').style.width = (clamp01(t / DUR) * 100).toFixed(2) + '%';
  // Les reperes de cadrage se posent une fois, puis ne bougent plus.
  const cp = eOut(clamp01(seg(t, 0, .5)));
  ['cTL', 'cTR', 'cBL', 'cBR'].forEach((id) => { $(id).style.opacity = cp * .75; });
  drawScene(t);
  drawSubs(t);
}
window.renderFrame = render;
window.SCENE_DURATION = DUR;
render(0);
</script>
</body>
</html>
