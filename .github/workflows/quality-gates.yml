name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ops-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic ops tests
        run: npm run test:ops:all
