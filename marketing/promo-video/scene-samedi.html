<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pinlane — Samedi</title>
<link rel="stylesheet" href="../../assets/pinlane.css">
<style>
  /* =====================================================================
     CREA « SAMEDI » — l'oppose de « pinlane-zoom » sur six axes.

       ratio    9:16 vertical           (contre 16:9)
       DA       claire, papier & encre  (contre sombre, verre, halos)
       montage  coupes seches           (contre glissements continus)
       voix     feminine, tutoiement    (contre off masculine corporate)
       preuve   captures fixes posees   (contre clip 3D en perspective)
       recit    la journee d'un samedi  (contre demo de fonctionnalites)

     Une variante qui ne changerait qu'un ou deux axes ne dirait rien en
     test A/B : on ne saurait pas ce qui a fait la difference.

     POURQUOI LES COUPES SECHES SUPPRIMENT UNE CLASSE DE BUGS.
     Le defaut le plus tenace des versions precedentes etait la frame vide a
     la couture : un plan qui monte depuis l'opacite 0 pendant que le
     precedent est detruit. Ici PLUS AUCUN element n'anime son opacite —
     chaque plan est opaque des sa premiere image, seul un leger deplacement
     s'anime. La frame vide devient impossible, pas seulement improbable.

     ECHELLE. La scene est ecrite en 1080x1920, soit exactement la definition
     de livraison des reseaux. Un pixel CSS = un pixel livre, donc une capture
     de 952 px de large peut occuper jusqu'a 952 px sans jamais etre agrandie.
     Le master est rendu plus grand seulement pour l'anticrenelage.
     ===================================================================== */
  @font-face { font-family:'Geist'; src:url('../../assets/fonts/geist-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  @font-face { font-family:'Geist Mono'; src:url('../../assets/fonts/geist-mono-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#f4f1ea}
  body{font-family:var(--font-ui);color:#14120e;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f4f1ea}

  /* Papier : une trame tres legere et un grain. Un aplat parfaitement lisse
     sonne « slide PowerPoint » ; c'est le bruit qui fait la matiere. */
  #trame{position:absolute;inset:-6%;opacity:.5;
    background-image:linear-gradient(rgba(20,18,14,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(20,18,14,.055) 1px,transparent 1px);
    background-size:54px 54px;will-change:transform}
  #grain{position:absolute;inset:0;opacity:.055;pointer-events:none;
    background-image:radial-gradient(#14120e 1px,transparent 1px);
    background-size:3px 3px}
  #teinte{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(78% 52% at 50% 22%,rgba(255,255,255,.85),transparent 68%),
               radial-gradient(70% 44% at 50% 104%,rgba(190,182,166,.35),transparent 70%)}
  /* Le flash de coupe : deux images de blanc a chaque changement de plan.
     C'est ce qui donne la frappe du montage sans aucun fondu. */
  #flash{position:absolute;inset:0;background:#fffdf8;opacity:0;pointer-events:none}

  #marque{position:absolute;left:88px;top:104px;display:flex;align-items:center;gap:16px;
    font-family:var(--font-data);font-size:25px;letter-spacing:.30em;text-transform:uppercase;
    color:#8a8377}
  #marque b{display:block;width:15px;height:15px;border-radius:50%;background:#2563eb}

  #heure{position:absolute;left:84px;top:212px;font-family:var(--font-data);
    font-size:200px;line-height:.86;letter-spacing:-.055em;font-weight:600;color:#14120e;
    will-change:transform}
  #filet{position:absolute;left:88px;top:452px;height:5px;background:#14120e;width:0}

  #phrase{position:absolute;left:88px;right:88px;top:512px;
    font-size:66px;line-height:1.16;font-weight:600;letter-spacing:-.028em;color:#14120e}
  #phrase em{font-style:normal;color:#2563eb}

  /* Les trois etats du plan 3 : ils s'allument l'un apres l'autre. */
  #jalons{position:absolute;left:88px;right:88px;top:512px;display:flex;flex-direction:column;gap:26px}
  #jalons div{display:flex;align-items:center;gap:24px;font-size:56px;font-weight:600;
    letter-spacing:-.02em}
  #jalons i{display:block;width:44px;height:44px;border-radius:12px;border:4px solid #c9c2b2;
    flex:0 0 auto;position:relative}
  /* Element reel et non pseudo-element : un ::after ne se pilote pas depuis le
     JS, et le rendu doit rester une fonction du temps. */
  #jalons u{position:absolute;inset:7px;border-radius:5px;background:#15803d;
    transform:scale(0);transform-origin:50% 50%}

  /* Le bilan du plan 8 : trois chiffres empiles, pas une phrase. */
  #bilan{position:absolute;left:88px;right:88px;top:470px}
  #bilan div{display:flex;align-items:baseline;gap:28px;margin-bottom:22px}
  #bilan span.n{font-family:var(--font-data);font-size:118px;line-height:1;font-weight:600;
    letter-spacing:-.05em;color:#14120e;min-width:330px}
  #bilan span.l{font-size:42px;color:#6f6a60;letter-spacing:-.01em}

  /* La preuve : une capture du produit, posee a plat. Aucune perspective —
     c'est justement ce qui la distingue de l'autre film. */
  #preuve{position:absolute;left:88px;border-radius:22px;overflow:hidden;background:#fff;
    box-shadow:0 3px 0 rgba(20,18,14,.06), 0 26px 60px rgba(20,18,14,.14),
               0 2px 6px rgba(20,18,14,.09);
    will-change:transform,left,top,width,height}
  #preuve img{display:block;width:100%;height:100%;object-fit:cover}
  #legende{position:absolute;left:88px;font-family:var(--font-data);font-size:24px;
    letter-spacing:.26em;text-transform:uppercase;color:#8a8377}

  /* Fin de marque */
  #fin{position:absolute;left:0;right:0;top:640px;text-align:center}
  #fin img{display:block;width:780px;margin:0 auto}
  #fin p{margin-top:56px;font-size:52px;font-weight:600;color:#14120e;letter-spacing:-.02em}
  #fin s{display:inline-block;margin-top:44px;text-decoration:none;background:#2563eb;color:#fff;
    font-size:44px;font-weight:700;padding:30px 66px;border-radius:16px;
    box-shadow:0 18px 44px rgba(37,99,235,.32)}

  /* La journee qui avance : 10h a 23h. Elle relie les plans entre eux. */
  #jour{position:absolute;left:88px;right:88px;bottom:196px}
  #jourBar{position:relative;height:6px;background:rgba(20,18,14,.12);border-radius:3px}
  #jourIn{position:absolute;left:0;top:0;bottom:0;background:#14120e;border-radius:3px;width:0}
  #jourPt{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
    border-radius:50%;background:#2563eb;box-shadow:0 0 0 8px rgba(37,99,235,.16)}
  #jourEch{display:flex;justify-content:space-between;margin-top:22px;
    font-family:var(--font-data);font-size:23px;letter-spacing:.16em;color:#8a8377}

  #pied{position:absolute;left:88px;right:88px;bottom:104px;display:flex;
    align-items:center;justify-content:space-between;
    font-family:var(--font-data);font-size:24px;letter-spacing:.26em;
    text-transform:uppercase;color:#8a8377}
</style>
</head>
<body>
<div id="stage">
  <div id="trame"></div>
  <div id="teinte"></div>

  <div id="marque"><b></b><span>Samedi · centre de loisirs</span></div>
  <div id="heure"></div>
  <div id="filet"></div>
  <div id="phrase"></div>

  <div id="jalons">
    <div><i><u></u></i><span>Au planning</span></div>
    <div><i><u></u></i><span>Confirmée</span></div>
    <div><i><u></u></i><span>Encaissée</span></div>
  </div>

  <div id="bilan">
    <div><span class="n" id="b1">0 €</span><span class="l">encaissés</span></div>
    <div><span class="n" id="b2">0</span><span class="l">réservations</span></div>
    <div><span class="n" id="b3">0</span><span class="l">saisie</span></div>
  </div>

  <div id="preuve"><img id="pimg" alt=""></div>
  <div id="legende"></div>

  <div id="fin">
    <img src="../../artifacts/promo-video/logo-clair-net.png" alt="Pinlane">
    <p>La console de ton centre.</p>
    <s>Réserver une démo</s>
  </div>

  <div id="jour">
    <div id="jourBar"><div id="jourIn"></div><div id="jourPt"></div></div>
    <div id="jourEch"><span>10 h</span><span>14 h</span><span>18 h</span><span>23 h</span></div>
  </div>
  <div id="pied"><span>Pinlane</span><span id="piedD">pinlane.app</span></div>

  <div id="grain"></div>
  <div id="flash"></div>
</div>

<script src="../../artifacts/promo-video/voix-samedi-plans-plans.js"></script>
<script src="../../artifacts/promo-clips/details-light/details.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const eOut = (x) => 1 - Math.pow(1 - x, 4);
const lerp = (a, b, x) => a + (b - a) * x;

// ---------------------------------------------------------------------------
// LES BORNES VIENNENT DE LA VOIX, ELLES NE SONT PAS ECRITES ICI.
//
// voice-segments.js genere un segment de voix par plan et publie leurs bornes.
// Regenerer la voix decale automatiquement le montage : c'est la seule facon
// d'empecher la desynchronisation qui avait mis trois plans sur sept en face
// de la mauvaise page dans un film precedent.
// ---------------------------------------------------------------------------
const VOIX = window.PROMO_PLANS || [];
const D = window.PROMO_DETAILS || {};
window.MONTAGE_ERREURS = [];
if (!VOIX.length) window.MONTAGE_ERREURS.push('bornes de voix absentes');

const QUEUE = 0.5;                         // battement apres la derniere phrase
const DUR = (window.PROMO_VOIX_DUREE || 23.7) + QUEUE;

// Un plan par segment de voix. `preuve` nomme une capture de details-light ;
// null = pas d'image sur ce plan, c'est une respiration.
const PLANS = [
  { heure: '', titre: 'SAMEDI', preuve: null, legende: '', mode: 'ouverture', h: 10.0 },
  { heure: '11:04', phrase: 'Une résa tombe.<br><em>Tu es en salle.</em>', preuve: 'plan-lambert',
    legende: 'Le planning, en direct', h: 11.07 },
  { heure: '11:04', phrase: '', preuve: 'mail-confirmation', legende: 'Séquence automatique',
    mode: 'jalons', h: 11.2 },
  // Legende relue sur la capture elle-meme : « Bowling 2h », 17 joueurs. La
  // version d'essai disait « posé sur deux pistes » — rien a l'ecran ne le dit.
  { heure: '14:30', phrase: 'Un groupe de <em>dix-sept</em>.', preuve: 'plan-ecole',
    legende: 'Bowling · 2 h', h: 14.5 },
  { heure: '14:30', phrase: 'Le formulaire a tout demandé<br><em>à ta place.</em>',
    preuve: 'client-joueurs', legende: '3 pistes, calculées seules', h: 15.2 },
  { heure: '18:12', phrase: 'Le rappel de demain est parti.<br><em>Tout seul.</em>',
    preuve: 'mail-rappel', legende: 'Rappel avant la venue', h: 18.2 },
  { heure: '22:40', phrase: 'Tu fermes.', preuve: null, legende: '', h: 22.67 },
  { heure: '22:40', phrase: '', preuve: 'plan-ca', legende: 'Chiffre du jour',
    mode: 'bilan', h: 22.8 },
  { heure: '', phrase: '', preuve: null, legende: '', mode: 'fin', h: 23.0 },
];

// ---------------------------------------------------------------------------
// TAILLE DE LA PREUVE — meme regle que sur l'autre film, adaptee au portrait.
// Trois plafonds : la largeur utile, la hauteur disponible, et la DEFINITION
// NATIVE de la capture. Le troisieme est celui qui interdit le flou : on
// n'affiche jamais une image sur plus de pixels qu'elle n'en contient.
// ---------------------------------------------------------------------------
const LARGE_MAX = 904;      // 1080 moins deux marges de 88
const HAUT_MAX = 560;
const CENTRE_Y = 1250;      // la legende tient sous la plus haute carte
window.PREUVES_MANQUANTES = [];
function boitePreuve(cle) {
  const d = D[cle];
  if (!d) { window.PREUVES_MANQUANTES.push(cle); return [88, 1100, 500, 300]; }
  const w = Math.min(LARGE_MAX, d.w, HAUT_MAX * d.ratio);
  const h = w / d.ratio;
  // Ancree par son CENTRE : les captures vont du ratio 1,17 au ratio 3,97,
  // donc de 228 a 560 px de haut. Ancrees en haut, les plus plates laissaient
  // un trou de 330 px sous elles ; ancrees au centre, elles restent posees au
  // meme endroit de la page quelle que soit leur forme.
  return [88, Math.round(CENTRE_Y - h / 2), Math.round(w), Math.round(h)];
}

const planDe = (t) => {
  let i = 0;
  for (let n = 0; n < VOIX.length; n++) if (t >= VOIX[n].debut) i = n;
  return Math.min(i, PLANS.length - 1);
};

let dernierSrc = '';
function render(t) {
  const i = planDe(t);
  const p = PLANS[i];
  const v = VOIX[i] || { debut: 0, fin: DUR };
  const dans = t - v.debut;                       // age du plan courant

  // ---- decor : lent, continu, il ne se coupe jamais ----
  $('trame').style.transform = `translate(${(t * 5) % 54}px, ${(-t * 3) % 54}px)`;

  // ---- flash de coupe : deux images, sur les plans qui ne sont pas le premier
  const fl = i > 0 && dans < 0.08 ? (1 - dans / 0.08) * .85 : 0;
  $('flash').style.opacity = fl.toFixed(3);

  // ---- entrees : AUCUNE opacite animee ----
  // Chaque bloc est opaque des la premiere image de son plan et ne fait que
  // glisser en place. C'est ce qui rend la frame vide impossible.
  const glisse = (retard, dist) => lerp(dist, 0, eOut(clamp01((dans - retard) / 0.22)));

  const ouverture = p.mode === 'ouverture';
  const finale = p.mode === 'fin';

  $('marque').style.opacity = finale ? 0 : 1;
  $('marque').style.transform = `translateY(${glisse(0, -14)}px)`;

  $('heure').textContent = ouverture ? 'SAMEDI' : (p.heure || '');
  $('heure').style.opacity = (ouverture || p.heure) ? 1 : 0;
  $('heure').style.fontSize = ouverture ? '152px' : '200px';
  $('heure').style.transform = `translateY(${glisse(0.02, 26)}px)`;

  // Le filet se trace : c'est le seul trait qui « s'anime » vraiment, et il
  // donne le depart de lecture.
  const traceLarge = ouverture ? 904 : 344;
  $('filet').style.width = `${Math.round(eOut(clamp01((dans - 0.04) / 0.30)) * traceLarge)}px`;
  $('filet').style.opacity = finale ? 0 : 1;

  // ---- le corps du plan : phrase, jalons ou bilan ----
  const modePhrase = !p.mode || p.mode === 'ouverture';
  $('phrase').style.display = modePhrase ? 'block' : 'none';
  $('jalons').style.display = p.mode === 'jalons' ? 'flex' : 'none';
  $('bilan').style.display = p.mode === 'bilan' ? 'block' : 'none';
  $('fin').style.display = finale ? 'block' : 'none';

  // L'ouverture annonce l'amplitude reelle du centre — 10 h - 22 h est lu sur
  // l'entete du planning, comme tous les chiffres de ce film.
  if (ouverture) {
    $('phrase').innerHTML = '<em>10 h — 22 h.</em><br>Une journée entière.';
  } else if (modePhrase) {
    $('phrase').innerHTML = p.phrase || '';
  }
  $('phrase').style.transform = `translateY(${glisse(0.06, 30)}px)`;

  if (p.mode === 'jalons') {
    // Les trois etats s'allument QUAND LA VOIX LES NOMME. Les instants sont
    // exprimes en fraction du segment, pas en secondes : si la voix est
    // regeneree un peu plus vite, les coches suivent d'elles-memes.
    const durV = Math.max(0.8, v.fin - v.debut);
    const QUAND = [0.38, 0.68, 0.88];
    [...$('jalons').children].forEach((el, k) => {
      const a = eOut(clamp01((dans - QUAND[k] * durV) / 0.24));
      el.style.transform = `translateY(${glisse(0.06 + k * 0.04, 26)}px)`;
      const cadre = el.querySelector('i');
      cadre.style.borderColor = a > .04 ? '#15803d' : '#c9c2b2';
      cadre.style.background = a > .04 ? 'rgba(21,128,61,.08)' : 'transparent';
      // La coche grandit au lieu d'apparaitre : un carre qui surgit d'un coup
      // se lit comme un defaut d'affichage.
      el.querySelector('u').style.transform = `scale(${a.toFixed(3)})`;
      el.querySelector('span').style.color = a > .5 ? '#14120e' : '#9a9385';
    });
  }

  if (p.mode === 'bilan') {
    const c = (retard) => eOut(clamp01((dans - retard) / 0.62));
    $('b1').textContent = `${Math.round(601 * c(0.10))} €`;
    $('b2').textContent = `${Math.round(4 * c(0.36))}`;
    $('b3').textContent = `${Math.round(0 * c(0.62))}`;
    [...$('bilan').children].forEach((el, k) => {
      el.style.transform = `translateY(${glisse(0.06 + k * 0.06, 28)}px)`;
    });
  }

  // ---- la preuve ----
  const pr = $('preuve');
  if (p.preuve) {
    const b = boitePreuve(p.preuve);
    const src = '../../artifacts/promo-clips/details-light/' + p.preuve + '.png';
    if (dernierSrc !== src) { $('pimg').setAttribute('src', src); dernierSrc = src; }
    pr.style.display = 'block';
    pr.style.left = b[0] + 'px'; pr.style.top = b[1] + 'px';
    pr.style.width = b[2] + 'px'; pr.style.height = b[3] + 'px';
    // Respiration : la carte s'eleve tres legerement pendant son plan. Le
    // mouvement porte sur LA CARTE, jamais sur l'image : agrandir l'image
    // rognerait son texte.
    const vie = clamp01(dans / Math.max(0.8, (v.fin - v.debut)));
    pr.style.transform = `translateY(${glisse(0.10, 40) - vie * 10}px)`;
    $('legende').style.display = 'block';
    $('legende').textContent = p.legende;
    $('legende').style.top = (b[1] + b[3] + 30) + 'px';
    $('legende').style.transform = `translateY(${glisse(0.16, 20)}px)`;
  } else {
    pr.style.display = 'none';
    $('legende').style.display = 'none';
  }

  if (finale) {
    $('fin').style.transform = `translateY(${glisse(0.02, 34)}px)`;
  }

  // ---- la journee ----
  // Le curseur se pose sur l'heure DU PLAN COURANT et rejoint la suivante en
  // 0,35 s a la coupe. Une progression continue vers l'heure suivante le
  // montrait a 14 h pendant que le titre affichait « 11:04 » — l'oeil lit les
  // deux en meme temps, la contradiction se voit.
  const prec = PLANS[Math.max(0, i - 1)];
  const hCourante = lerp(prec.h, p.h, eOut(clamp01(dans / 0.35)));
  const q = clamp01((hCourante - 10) / 13);
  $('jourIn').style.width = (q * 100).toFixed(2) + '%';
  $('jourPt').style.left = (q * 100).toFixed(2) + '%';
  $('jour').style.opacity = finale ? 0 : 1;
  $('pied').style.opacity = finale ? 0 : 1;
}

window.renderFrame = render;
window.SCENE_DURATION = DUR;
render(0);
</script>
</body>
</html>
