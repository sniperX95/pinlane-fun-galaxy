<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pinlane — Samedi</title>
<link rel="stylesheet" href="../../assets/pinlane.css">
<style>
  /* =====================================================================
     CREA « SAMEDI » — verticale, DA claire, motion design editorial.

     CE QUI A CHANGE APRES LE PREMIER JET, ET POURQUOI.

     Reproche : « aucun motion design, que des apparitions simples rapides ».
     Il etait fonde. J'avais choisi des coupes seches parce qu'elles rendent
     la frame vide IMPOSSIBLE (aucune opacite animee, donc aucun trou a la
     couture) — un argument de securite, pas un argument de mise en scene.
     Le gout du commanditaire passe avant ma commodite.

     Le mouvement vient maintenant de six gestes, pas d'une translation :
       . les chiffres ROULENT comme un compteur mecanique, colonne par
         colonne, avec un decalage entre elles ;
       . le texte se REVELE mot a mot derriere un masque qui s'ouvre par le
         bas, en cascade ;
       . un RIDEAU d'encre balaie l'ecran a chaque coupe ;
       . la carte de preuve s'ouvre derriere un masque DIAGONAL, se redresse,
         puis un reflet la traverse ;
       . le filet se trace et un point de lumiere le parcourt ;
       . la journee laisse une TRAINEE derriere son curseur.

     La securite est conservee autrement : le rideau ne couvre jamais tout
     l'ecran (55 % de la hauteur), et aucun plan ne demarre a l'opacite zero
     sur la totalite de son contenu. La garde check-frames reste au vert.
     ===================================================================== */
  @font-face { font-family:'Geist'; src:url('../../assets/fonts/geist-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  @font-face { font-family:'Geist Mono'; src:url('../../assets/fonts/geist-mono-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#f4f1ea}
  body{font-family:var(--font-ui);color:#14120e;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f4f1ea}

  #trame{position:absolute;inset:-10%;opacity:.5;
    background-image:linear-gradient(rgba(20,18,14,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(20,18,14,.055) 1px,transparent 1px);
    background-size:54px 54px;will-change:transform}
  #onde{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;
    border:3px solid rgba(37,99,235,.5);border-radius:50%;opacity:0;will-change:transform,opacity}
  #grain{position:absolute;inset:0;opacity:.055;pointer-events:none;
    background-image:radial-gradient(#14120e 1px,transparent 1px);background-size:3px 3px}
  #teinte{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(78% 52% at 50% 22%,rgba(255,255,255,.85),transparent 68%),
               radial-gradient(70% 44% at 50% 104%,rgba(190,182,166,.35),transparent 70%)}

  /* Le rideau : une bande, jamais l'ecran entier. */
  #rideau{position:absolute;left:-4%;width:108%;height:55%;background:#14120e;
    top:0;opacity:0;will-change:transform,opacity}

  #marque{position:absolute;left:88px;top:104px;display:flex;align-items:center;gap:16px;
    font-family:var(--font-data);font-size:25px;letter-spacing:.30em;text-transform:uppercase;
    color:#8a8377;will-change:transform}
  #marque b{display:block;width:15px;height:15px;border-radius:50%;background:#2563eb}
  #num{position:absolute;right:88px;top:100px;font-family:var(--font-data);font-size:25px;
    letter-spacing:.22em;color:#b3aa99}

  /* ---- Compteur mecanique ----
     Chaque chiffre est une colonne de 0 a 9 dans une fenetre a hauteur fixe.
     On ne remplace jamais le texte : on DEPLACE la colonne. C'est ce qui
     donne le roulement, et ca reste une fonction du temps. */
  #heure{position:absolute;left:84px;top:206px;display:flex;align-items:flex-start;
    height:206px;will-change:transform}
  /* 128 px et non 118 : a 200 px de corps, un chiffre de Geist Mono en occupe
     ~120, et les colonnes trop etroites faisaient chevaucher le separateur. */
  #heure .col{position:relative;width:128px;height:206px;overflow:hidden}
  #heure .col .pile{position:absolute;left:0;top:0;width:100%;will-change:transform}
  #heure .col .pile span{display:block;height:206px;line-height:206px;text-align:center;
    font-family:var(--font-data);font-size:200px;letter-spacing:-.055em;font-weight:600;color:#14120e}
  /* En monospace, le « : » a la MEME avance qu'un chiffre : dans une boite de
     44 px il debordait de 38 px de chaque cote et se posait sur le zero.
     La boite doit valoir son avance reelle, pas sa largeur apparente. */
  #heure .sep{width:112px;height:206px;line-height:196px;text-align:center;
    font-family:var(--font-data);font-size:190px;font-weight:600;color:#14120e}
  #titre{position:absolute;left:88px;top:206px;font-family:var(--font-data);
    font-size:152px;line-height:206px;letter-spacing:-.04em;font-weight:600;color:#14120e;
    white-space:nowrap;overflow:hidden;will-change:clip-path}

  #filet{position:absolute;left:88px;top:452px;height:5px;background:#14120e;width:0}
  #filetPt{position:absolute;top:449px;width:11px;height:11px;border-radius:50%;
    background:#2563eb;opacity:0;box-shadow:0 0 0 6px rgba(37,99,235,.18)}

  /* ---- Texte revele mot a mot derriere un masque ---- */
  #phrase{position:absolute;left:88px;right:88px;top:508px;
    font-size:66px;line-height:1.18;font-weight:600;letter-spacing:-.028em;color:#14120e}
  #phrase .m{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
  #phrase .m u{display:inline-block;text-decoration:none;will-change:transform}
  #phrase .b{color:#2563eb}

  #jalons{position:absolute;left:88px;right:88px;top:508px;display:flex;flex-direction:column;gap:26px}
  #jalons div{display:flex;align-items:center;gap:24px;font-size:56px;font-weight:600;letter-spacing:-.02em}
  #jalons i{display:block;width:44px;height:44px;border-radius:12px;border:4px solid #c9c2b2;
    flex:0 0 auto;position:relative}
  #jalons u{position:absolute;inset:7px;border-radius:5px;background:#15803d;
    transform:scale(0);transform-origin:50% 50%}

  /* Les plans a chiffres n'ont plus d'heure au-dessus : le bloc remonte pour
     occuper la place liberee, sinon le tiers haut de l'image reste vide. */
  #bilan{position:absolute;left:88px;right:88px;top:300px}
  #bilan .l{display:flex;align-items:center;gap:28px;margin-bottom:26px}
  #bilan .ch{display:flex;height:118px;overflow:hidden}
  #bilan .ch .col{position:relative;width:70px;height:118px;overflow:hidden}
  #bilan .ch .col .pile{position:absolute;left:0;top:0;width:100%;will-change:transform}
  #bilan .ch .col .pile span{display:block;height:118px;line-height:118px;text-align:center;
    font-family:var(--font-data);font-size:112px;font-weight:600;letter-spacing:-.05em;color:#14120e}
  #bilan .ch .u{height:118px;line-height:118px;font-family:var(--font-data);font-size:112px;
    font-weight:600;letter-spacing:-.05em;color:#14120e;padding-left:12px}
  #bilan .lg{font-size:42px;color:#6f6a60;letter-spacing:-.01em}

  /* ---- La preuve ---- */
  #preuve{position:absolute;left:88px;will-change:transform,left,top,width,height}
  #cadre{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:#fff;
    box-shadow:0 3px 0 rgba(20,18,14,.06), 0 26px 60px rgba(20,18,14,.14),
               0 2px 6px rgba(20,18,14,.09);will-change:clip-path}
  #cadre img{display:block;width:100%;height:100%;object-fit:cover}
  #reflet{position:absolute;top:-40%;bottom:-40%;width:38%;left:0;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
    filter:blur(14px);transform:skewX(-18deg);will-change:transform,opacity}
  #legende{position:absolute;left:88px;font-family:var(--font-data);font-size:24px;
    letter-spacing:.26em;text-transform:uppercase;color:#8a8377;overflow:hidden;white-space:nowrap}

  #fin{position:absolute;left:0;right:0;top:600px;text-align:center}
  #finLogo{display:inline-block;will-change:transform}
  #fin img{display:block;width:780px;margin:0 auto}
  #fin p{margin-top:52px;font-size:52px;font-weight:600;color:#14120e;letter-spacing:-.02em;
    overflow:hidden}
  #finCta{display:inline-block;margin-top:44px;background:#2563eb;color:#fff;
    font-size:44px;font-weight:700;padding:30px 66px;border-radius:16px;
    box-shadow:0 18px 44px rgba(37,99,235,.32);will-change:transform}

  #jour{position:absolute;left:88px;right:88px;bottom:196px}
  #jourBar{position:relative;height:6px;background:rgba(20,18,14,.12);border-radius:3px}
  #jourIn{position:absolute;left:0;top:0;bottom:0;background:#14120e;border-radius:3px;width:0}
  #jourTr{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.30);border-radius:3px;
    width:0;left:0}
  #jourPt{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
    border-radius:50%;background:#2563eb;box-shadow:0 0 0 8px rgba(37,99,235,.16)}
  #jourEch{display:flex;justify-content:space-between;margin-top:22px;
    font-family:var(--font-data);font-size:23px;letter-spacing:.16em;color:#8a8377}
  #jourEch span{transition:none}

  #pied{position:absolute;left:88px;right:88px;bottom:104px;display:flex;
    align-items:center;justify-content:space-between;
    font-family:var(--font-data);font-size:24px;letter-spacing:.26em;
    text-transform:uppercase;color:#8a8377}
</style>
</head>
<body>
<div id="stage">
  <div id="trame"></div>
  <div id="teinte"></div>
  <div id="onde"></div>

  <div id="marque"><b></b><span>Samedi · centre de loisirs</span></div>
  <div id="num">01 / 09</div>

  <div id="heure"></div>
  <div id="titre">SAMEDI</div>
  <div id="filet"></div>
  <div id="filetPt"></div>
  <div id="phrase"></div>

  <div id="jalons">
    <div><i><u></u></i><span>Au planning</span></div>
    <div><i><u></u></i><span>Confirmée</span></div>
    <div><i><u></u></i><span>Payée</span></div>
  </div>

  <div id="bilan"></div>

  <div id="preuve"><div id="cadre"><img id="pimg" alt=""><div id="reflet"></div></div></div>
  <div id="legende"></div>

  <div id="fin">
    <div id="finLogo"><img src="../../artifacts/promo-video/logo-clair-net.png" alt="Pinlane"></div>
    <p id="finP">La console de ton centre.</p>
    <div><span id="finCta">Réserver une démo</span></div>
  </div>

  <div id="jour">
    <div id="jourBar"><div id="jourIn"></div><div id="jourTr"></div><div id="jourPt"></div></div>
    <div id="jourEch"><span>10 h</span><span>14 h</span><span>18 h</span><span>23 h</span></div>
  </div>
  <div id="pied"><span>Pinlane</span><span>pinlane.app</span></div>

  <div id="rideau"></div>
  <div id="grain"></div>
</div>

<!-- Bornes de la version en cours de rendu. Chaque version (masculine /
     feminine) a son propre fichier de bornes ; celui-ci en est une copie,
     posee avant le rendu. La scene ne connait donc qu'un seul chemin, et
     changer de voix ne demande aucune modification ici. -->
<script src="../../artifacts/promo-video/voix-samedi-plans-plans.js"></script>
<script src="../../artifacts/promo-clips/details-light/details.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const eOut = (x) => 1 - Math.pow(1 - x, 4);
const eInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
// Ressort amorti, ecrit en forme close : une integration pas a pas dependrait
// de l'image precedente, et le rendu doit rester une fonction du temps seul.
const ressort = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x) * Math.cos((x * 10 - .75) * 2.4);
const lerp = (a, b, x) => a + (b - a) * x;

const VOIX = window.PROMO_PLANS || [];
const D = window.PROMO_DETAILS || {};
window.MONTAGE_ERREURS = [];
if (!VOIX.length) window.MONTAGE_ERREURS.push('bornes de voix absentes');
const QUEUE = 0.55;
const DUR = (window.PROMO_VOIX_DUREE || 23.7) + QUEUE;

// Sept plans, et un GRAND CHIFFRE plutot qu'une heure : la chronologie
// horaire a laisse la place aux volumes, parce que c'est le volume qui prouve
// qu'un outil de pilotage sert a quelque chose. Chaque nombre est lu sur la
// capture affichee juste en dessous.
const PLANS = [
  { titre: 'SAMEDI', mode: 'ouverture', preuve: 'plan-titre', legende: '8 pistes · 10 h — 22 h',
    phrase: 'Le centre|tourne à plein.', bleu: [1], h: 10 },
  { num: '38', unite: '', libelle: 'réservations', num2: '297', libelle2: 'joueurs',
    mode: 'double', preuve: 'dash-donut', legende: 'Aujourd’hui', h: 13 },
  { phrase: 'Et toi,|tu n’as rien saisi.', bleu: [1], preuve: null, legende: '', h: 15 },
  { phrase: 'Arrivées toutes seules,|du formulaire au planning.', bleu: [1],
    preuve: 'plan-booking', legende: 'Posée sur la piste 1', h: 17 },
  { phrase: '', mode: 'jalons', preuve: 'mail-confirmation', legende: 'Séquence automatique', h: 19 },
  { num: '76', unite: ' %', libelle: 'de tes pistes occupées', mode: 'simple',
    preuve: 'dash-occup', legende: 'Taux d’occupation', h: 21 },
  { phrase: '', mode: 'fin', preuve: null, legende: '', h: 22 },
];

const planDe = (t) => {
  let i = 0;
  for (let n = 0; n < VOIX.length; n++) if (t >= VOIX[n].debut) i = n;
  return Math.min(i, PLANS.length - 1);
};


// ===========================================================================
// ANIMATION : ENTREE, VIE, SORTIE — pour CHAQUE element, sans exception.
//
// Reproche de Movsar : « il faut de l'animation partout, chaque entrée chaque
// sortie pendant ». La version precedente n'animait que les entrees ; a la
// coupe, tout disparaissait d'un coup. Un element qui s'en va sans geste
// annule le geste qu'il avait fait en arrivant.
//
// `phase()` donne les trois temps d'un element pour le plan courant :
//   e = son entree   (0 -> 1 sur 0,42 s apres son retard propre)
//   v = sa vie       (0 -> 1 sur toute la duree du plan, pour le mouvement lent)
//   s = sa sortie    (0 -> 1 sur les 0,34 s qui precedent la coupe)
// Chaque bloc s'en sert pour composer son propre mouvement : rien n'apparait
// ni ne disparait sans etre passe par les trois.
// ===========================================================================
const ENTREE = 0.42;
const SORTIE = 0.34;
function phase(dans, duree, retard) {
  const e = eOut(clamp01((dans - (retard || 0)) / ENTREE));
  const v = clamp01(dans / Math.max(0.6, duree));
  const s = eOut(clamp01((dans - (duree - SORTIE)) / SORTIE));
  return { e, v, s };
}

// --- compteur mecanique : colonnes de 0 a 9 que l'on DEPLACE ---------------
const H_BIL = 118;
function batirCompteur(hote, nb) {
  hote.innerHTML = '';
  for (let i = 0; i < nb; i++) {
    const c = document.createElement('div'); c.className = 'col';
    const p = document.createElement('div'); p.className = 'pile';
    for (let n = 0; n <= 9; n++) {
      const sp = document.createElement('span'); sp.textContent = n; p.appendChild(sp);
    }
    c.appendChild(p); hote.appendChild(c);
  }
}
// Les unites roulent vite, les dizaines plus lentement : c'est ce rapport qui
// fait lire « un compteur qui totalise » plutot que « un texte qui change ».
function poserCompteur(hote, valeur, avance) {
  const piles = [...hote.querySelectorAll('.pile')];
  const v = valeur * avance;
  piles.forEach((pile, k) => {
    const rang = Math.pow(10, piles.length - 1 - k);
    pile.style.transform = `translateY(${(-((v / rang) % 10) * H_BIL).toFixed(2)}px)`;
  });
}

// --- texte revele mot a mot derriere un masque -----------------------------
let clePhrase = '';
function batirPhrase(p) {
  const cle = (p.phrase || '') + '|' + (p.bleu || []).join(',');
  if (clePhrase === cle) return;
  clePhrase = cle;
  const lignes = (p.phrase || '').split('|');
  $('phrase').innerHTML = lignes.map((ligne, li) => {
    const bleu = (p.bleu || []).includes(li);
    return ligne.split(' ').map((mot) =>
      `<span class="m${bleu ? ' b' : ''}"><u>${mot}</u></span>`).join(' ');
  }).join('<br>');
}

const LARGE_MAX = 904, HAUT_MAX = 520, CENTRE_Y = 1270;
window.PREUVES_MANQUANTES = [];
function boitePreuve(cle) {
  const d = D[cle];
  if (!d) { window.PREUVES_MANQUANTES.push(cle); return [88, 1120, 500, 300]; }
  const w = Math.min(LARGE_MAX, d.w, HAUT_MAX * d.ratio);
  const h = w / d.ratio;
  return [88, Math.round(CENTRE_Y - h / 2), Math.round(w), Math.round(h)];
}

function render(t) {
  const i = planDe(t);
  const p = PLANS[i];
  const prev = PLANS[Math.max(0, i - 1)];
  const v = VOIX[i] || { debut: 0, fin: DUR };
  const dans = t - v.debut;
  const duree = Math.max(0.9, (v.fin + (v.pause || 0)) - v.debut);
  const ouverture = p.mode === 'ouverture';
  const finale = p.mode === 'fin';

  // ---- decor : jamais immobile ----
  $('trame').style.transform =
    `translate(${(t * 6) % 54}px, ${(-t * 4) % 54}px) scale(${1 + Math.sin(t * .55) * .005})`;
  const o = clamp01(dans / 0.62);
  $('onde').style.opacity = i > 0 && o < 1 ? (1 - o) * .3 : 0;
  $('onde').style.transform = `scale(${(0.4 + o * 5.5).toFixed(3)})`;

  // ---- rideau : une bande d'encre balaie a chaque coupe ----
  const r = clamp01(dans / 0.32);
  $('rideau').style.opacity = i > 0 && r < 1 ? 1 : 0;
  $('rideau').style.transform = `translateY(${(lerp(-58, 100, eInOut(r)) * 19.2).toFixed(1)}px)`;

  // ---- entete ----
  const ph0 = phase(dans, duree, 0);
  $('marque').style.opacity = finale ? 0 : (1 - ph0.s * 0.85);
  $('marque').style.transform = `translateY(${(lerp(-16, 0, ph0.e) - ph0.s * 14).toFixed(1)}px)`;
  $('num').textContent = `${String(i + 1).padStart(2, '0')} / 0${PLANS.length}`;
  $('num').style.opacity = finale ? 0 : (1 - ph0.s * 0.85);

  // ---- le grand chiffre ----
  const aChiffre = p.mode === 'simple' || p.mode === 'double';
  $('heure').style.display = 'none';
  $('titre').style.display = ouverture ? 'block' : 'none';
  $('bilan').style.display = aChiffre ? 'block' : 'none';

  if (ouverture) {
    const c = eOut(clamp01(dans / 0.55));
    // Il ENTRE par un volet qui s'ouvre, il SORT par un volet qui se ferme.
    $('titre').style.clipPath =
      `inset(0 ${((1 - c) * 100).toFixed(1)}% 0 ${(ph0.s * 100).toFixed(1)}%)`;
    $('titre').style.transform = `translateY(${(-ph0.s * 26).toFixed(1)}px)`;
  }

  if (aChiffre) {
    const lignes = [...$('bilan').children];
    const cible = [Number(p.num), p.num2 ? Number(p.num2) : null];
    lignes.forEach((ligne, k) => {
      const actif = k === 0 || (k === 1 && p.num2);
      ligne.style.display = actif ? 'flex' : 'none';
      if (!actif) return;
      const f = phase(dans, duree, 0.10 + k * 0.22);
      poserCompteur(ligne.querySelector('.ch'), cible[k], eOut(clamp01((dans - (0.10 + k * 0.3)) / 0.85)));
      ligne.querySelector('.lg').textContent = k === 0 ? p.libelle : p.libelle2;
      const u = ligne.querySelector('.u');
      if (u) u.textContent = k === 0 ? (p.unite || '') : '';
      ligne.style.transform = `translateY(${((1 - f.e) * 40 - f.s * 30).toFixed(1)}px)`;
      ligne.style.opacity = (f.e * (1 - f.s)).toFixed(3);
    });
  }

  // ---- le filet : il se trace, puis se retire par l'autre bout ----
  // Il se place AU-DESSUS du bloc chiffre et SOUS le titre : sa hauteur suit
  // donc le mode du plan, sinon il traversait les compteurs.
  $('filet').style.top = aChiffre ? '236px' : '452px';
  $('filetPt').style.top = aChiffre ? '233px' : '449px';
  const large = ouverture ? 904 : 420;
  const trace = eOut(clamp01((dans - 0.05) / 0.32));
  $('filet').style.width = `${Math.round(trace * large * (1 - ph0.s))}px`;
  $('filet').style.marginLeft = `${(ph0.s * large * 0.35).toFixed(0)}px`;
  $('filet').style.opacity = finale ? 0 : 1;
  const ptv = clamp01((dans - 0.12) / 0.46);
  $('filetPt').style.opacity = (finale || ph0.s > 0.05) ? 0 : (ptv > 0 && ptv < 1 ? 1 : 0);
  $('filetPt').style.left = `${Math.round(84 + eOut(ptv) * large)}px`;

  // ---- la phrase, mot a mot a l'entree ET a la sortie ----
  const modePhrase = !p.mode || ouverture;
  $('phrase').style.display = modePhrase ? 'block' : 'none';
  $('jalons').style.display = p.mode === 'jalons' ? 'flex' : 'none';
  $('fin').style.display = finale ? 'block' : 'none';

  if (modePhrase) {
    batirPhrase(p);
    const mots = [...$('phrase').querySelectorAll('.m u')];
    mots.forEach((el, k) => {
      const f = phase(dans, duree, 0.14 + k * 0.05);
      // Les mots partent dans l'ordre INVERSE de leur arrivee : le dernier
      // arrive est le premier a s'en aller, comme une vague qui reflue.
      const sMot = eOut(clamp01((dans - (duree - SORTIE - (mots.length - 1 - k) * 0.03)) / SORTIE));
      el.style.transform = `translateY(${((1 - f.e) * 108 - sMot * 112).toFixed(2)}%)`;
    });
  }

  if (p.mode === 'jalons') {
    const QUAND = [0.30, 0.56, 0.80];
    [...$('jalons').children].forEach((el, k) => {
      const f = phase(dans, duree, 0.10 + k * 0.07);
      const a = eOut(clamp01((dans - QUAND[k] * duree) / 0.22));
      el.style.transform = `translateX(${((1 - f.e) * -46 + f.s * 40).toFixed(1)}px)`;
      el.style.opacity = (f.e * (1 - f.s)).toFixed(3);
      const cadre = el.querySelector('i');
      cadre.style.borderColor = a > .04 ? '#15803d' : '#c9c2b2';
      cadre.style.background = a > .04 ? 'rgba(21,128,61,.08)' : 'transparent';
      el.querySelector('u').style.transform = `scale(${ressort(a).toFixed(3)})`;
      el.querySelector('span').style.color = a > .5 ? '#14120e' : '#9a9385';
    });
  }

  // ---- la preuve : masque diagonal a l'entree, l'inverse a la sortie ----
  const pr = $('preuve');
  if (p.preuve) {
    const b = boitePreuve(p.preuve);
    const src = '../../artifacts/promo-clips/details-light/' + p.preuve + '.png';
    if ($('pimg').getAttribute('src') !== src) $('pimg').setAttribute('src', src);
    pr.style.display = 'block';
    pr.style.left = b[0] + 'px'; pr.style.top = b[1] + 'px';
    pr.style.width = b[2] + 'px'; pr.style.height = b[3] + 'px';

    const f = phase(dans, duree, 0.16);
    pr.style.transform = `translateY(${((1 - f.e) * 56 + f.s * 46).toFixed(1)}px) `
      + `rotate(${(lerp(-1.6, 0, f.e) + f.s * 1.4).toFixed(2)}deg) `
      + `scale(${(lerp(0.955, 1, f.e) * (1 - f.s * 0.05)).toFixed(4)}) `
      + `translateY(${(Math.sin(f.v * Math.PI) * -10).toFixed(2)}px)`;
    pr.style.opacity = (1 - f.s).toFixed(3);
    const ouv = lerp(-30, 132, f.e) - f.s * 150;
    $('cadre').style.clipPath = `polygon(0% 0%, ${ouv}% 0%, ${ouv - 30}% 100%, 0% 100%)`;

    const g = clamp01((dans - 0.38) / 0.58);
    $('reflet').style.opacity = g > 0 && g < 1 ? (1 - Math.abs(g - .5) * 2) : 0;
    $('reflet').style.transform = `translateX(${lerp(-60, b[2] + 30, eOut(g))}px) skewX(-18deg)`;

    $('legende').style.display = 'block';
    $('legende').textContent = p.legende;
    $('legende').style.top = (b[1] + b[3] + 30) + 'px';
    const lg = eOut(clamp01((dans - 0.46) / 0.36));
    $('legende').style.clipPath = `inset(0 ${((1 - lg) * 100 + f.s * 100).toFixed(1)}% 0 0)`;
  } else {
    pr.style.display = 'none';
    $('legende').style.display = 'none';
  }

  if (finale) {
    const e = ressort(clamp01(dans / 0.95));
    $('finLogo').style.transform = `scale(${(0.86 + e * 0.14).toFixed(4)})`;
    const pp = eOut(clamp01((dans - 0.30) / 0.40));
    $('finP').style.clipPath = `inset(0 ${((1 - pp) * 100).toFixed(1)}% 0 0)`;
    const cc = ressort(clamp01((dans - 0.50) / 0.85));
    $('finCta').style.transform = `scale(${(0.8 + cc * 0.2).toFixed(4)})`;
  }

  // ---- la journee ----
  const hCourante = lerp(prev.h, p.h, eOut(clamp01(dans / 0.4)));
  const q = clamp01((hCourante - 10) / 13);
  const qPrec = clamp01((prev.h - 10) / 13);
  $('jourIn').style.width = (q * 100).toFixed(2) + '%';
  $('jourPt').style.left = (q * 100).toFixed(2) + '%';
  const tr = clamp01(1 - dans / 0.8);
  $('jourTr').style.left = (qPrec * 100).toFixed(2) + '%';
  $('jourTr').style.width = (Math.max(0, q - qPrec) * 100 * tr).toFixed(2) + '%';
  $('jourTr').style.opacity = tr.toFixed(2);
  [...$('jourEch').children].forEach((el, k) => {
    const seuils = [10, 14, 18, 23];
    el.style.color = hCourante >= seuils[k] - 0.2 ? '#14120e' : '#b3aa99';
  });
  $('jour').style.opacity = finale ? 0 : 1;
  $('pied').style.opacity = finale ? 0 : 1;
}

// Deux lignes de compteur, construites une fois : 2 chiffres pour « 38 » et
// « 76 », 3 pour « 297 ».
(function batirBilan() {
  const host = $('bilan');
  host.innerHTML = '';
  [2, 3].forEach(() => {
    const l = document.createElement('div'); l.className = 'l';
    const ch = document.createElement('div'); ch.className = 'ch';
    const u = document.createElement('div'); u.className = 'u';
    const lg = document.createElement('div'); lg.className = 'lg';
    l.appendChild(ch); ch.appendChild(u); l.appendChild(lg); host.appendChild(l);
  });
  batirCompteur($('bilan').children[0].querySelector('.ch'), 2);
  batirCompteur($('bilan').children[1].querySelector('.ch'), 3);
  // batirCompteur vide le conteneur : on remet l'unite APRES les colonnes.
  [...$('bilan').children].forEach((l) => {
    const u = document.createElement('div'); u.className = 'u';
    l.querySelector('.ch').appendChild(u);
  });
})();

window.renderFrame = render;
window.SCENE_DURATION = DUR;
render(0);
</script>
