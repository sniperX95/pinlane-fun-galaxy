<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <title>Fun Galaxy — Libramont · La carte</title>
  <meta name="description" content="La carte bar & snacks de Fun Galaxy Libramont.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preload" href="../assets/fonts/montserrat-latin-700.woff2" as="font" type="font/woff2" crossorigin>

<body class="pre">
  <!-- La carte : deux pages empilées, zoom natif (pincer comme une photo) -->

    <a class="back" id="backBtn" href="#" aria-label="Retour">&#8592;</a>

    <img class="page" src="./carte-2.jpg" alt="Carte Fun Galaxy Libramont — verso" width="2645" height="3742" loading="lazy" decoding="async">

      <img class="entry__logo" src="../assets/logo-fun-galaxy.svg" alt="Fun Galaxy" width="300" height="203">
