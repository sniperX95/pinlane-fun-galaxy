<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  /* Badge de marque incruste sur le film illustre.
     Fond transparent (capture avec omitBackground) : impossible de detourer le
     logo lui-meme, son blanc EST le papier du calendrier. On l'assoit donc sur
     une plaque blanche arrondie assumee, qui lit comme un badge et non comme un
     rectangle rate. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:560px;height:300px;background:transparent}
  #badge{position:absolute;left:20px;top:20px;width:520px;height:260px;
    background:#fff;border-radius:34px;
    box-shadow:0 18px 44px rgba(28,38,58,.22), 0 2px 6px rgba(28,38,58,.10);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #badge img{width:440px;height:auto;display:block}
</style>
</head>
<body>
  <div id="badge"><img src="../../artifacts/promo-video/logo-pinlane-clair.png" alt="Pinlane"></div>
</body>
</html>
