<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Pinlane - motion</title>
<link rel="stylesheet" href="../../assets/pinlane.css">
<style>
  /* La scene est dessinee en 2560x1440 CSS et rendue avec --scale 1.5, donc
     3840x2160 reels. Les clips sources sont eux aussi en 4K : le produit est
     toujours reduit, jamais agrandi, il ne peut pas baver. */
  @font-face { font-family:'Geist'; src:url('../../assets/fonts/geist-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  @font-face { font-family:'Geist Mono'; src:url('../../assets/fonts/geist-mono-latin.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden;background:#04060b}
  body{font-family:var(--font-ui);color:#fff;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:2560px;height:1440px;overflow:hidden;background:#04060b;
    perspective:2600px}

  /* ===== FOND VIVANT ================================================= */
  .orb{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform}
  #grid{position:absolute;inset:-10%;
    background-image:linear-gradient(rgba(50,145,255,.5) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(50,145,255,.5) 1px,transparent 1px);
    background-size:90px 90px;will-change:transform,opacity}
  /* Barre de lumiere qui traverse a chaque coupe : c'est elle qui donne le
     « claquement » visuel entre deux plans. */
  #sweep{position:absolute;top:-20%;bottom:-20%;width:420px;z-index:60;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(150,200,255,.5),transparent);
    filter:blur(28px);opacity:0;will-change:transform,opacity}

  /* ===== LE PRODUIT EN CARTE =========================================
     Le clip d'interaction ne remplit JAMAIS le cadre : il vit dans une carte
     posee dans l'espace, avec une legere rotation 3D. C'est ce qui fait la
     difference entre un screencast et du motion design. */
  .card{position:absolute;border-radius:26px;overflow:hidden;background:#0a0a0a;
    border:1px solid rgba(255,255,255,.13);will-change:transform,opacity;
    box-shadow:0 70px 180px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.05),
               0 0 120px rgba(50,145,255,.16)}
  .card video{position:absolute;left:0;top:0;width:100%;display:block}
  .card::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(150deg,rgba(255,255,255,.10),transparent 34%,rgba(4,6,11,.42))}
  /* Liseré lumineux en haut : la lumiere vient d'en haut, comme sur du verre. */
  .card::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;z-index:2;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}

  .chipf{position:absolute;display:inline-flex;align-items:center;gap:16px;
    padding:20px 34px;border-radius:99px;white-space:nowrap;
    background:rgba(12,16,24,.88);border:1px solid rgba(255,255,255,.16);
    font-size:34px;font-weight:600;color:#fff;
    box-shadow:0 26px 70px rgba(0,0,0,.75);will-change:transform,opacity}
  .chipf .dot{width:16px;height:16px;border-radius:99px;background:var(--accent);flex:0 0 16px;
    box-shadow:0 0 22px rgba(50,145,255,.9)}
  .chipf.g .dot{background:#3dd68c;box-shadow:0 0 22px rgba(61,214,140,.9)}
  /* La pastille du mot prononce : elle s'allume, les autres restent en retrait. */
  .chipf.on{background:rgba(50,145,255,.94);border-color:rgba(255,255,255,.5);
    box-shadow:0 26px 80px rgba(50,145,255,.6)}
  .chipf.on .dot{background:#fff;box-shadow:0 0 22px rgba(255,255,255,.9)}

  .ttl{position:absolute;font-weight:700;letter-spacing:-.045em;line-height:1.02;
    text-shadow:0 10px 50px rgba(0,0,0,.95);will-change:transform,opacity}
  .kick{position:absolute;font-family:var(--font-data);letter-spacing:.3em;
    text-transform:uppercase;font-size:28px;color:var(--accent)}

  #subs{position:absolute;left:180px;right:180px;bottom:96px;text-align:center}
  .w{display:inline-block;font-size:88px;line-height:1.1;font-weight:700;letter-spacing:-.04em;
    margin:0 16px 4px 0;color:#fff;text-shadow:0 8px 44px rgba(0,0,0,1)}
  .w.hi{color:#59a7ff}
  .w.win{color:#3dd68c}
  .w.bad{color:#ff6b6b}

  .badge{position:absolute;right:90px;top:80px;font-family:var(--font-data);
    font-size:28px;letter-spacing:.36em;text-transform:uppercase;color:rgba(255,255,255,.42)}

  .kpi{position:absolute;text-align:left}
  .kpi .n{font-family:var(--font-data);font-size:210px;letter-spacing:-.055em;line-height:.94;
    color:#3dd68c;text-shadow:0 0 140px rgba(61,214,140,.65)}
  .kpi .u{font-size:38px;color:rgba(255,255,255,.72);margin-top:14px}

  .logo{position:absolute;left:50%;top:520px;transform:translateX(-50%);display:flex;align-items:center;gap:36px}
  .logo .m{width:140px;height:140px;border-radius:38px;background:var(--accent);position:relative}
  .logo .m::after{content:'';position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:15px;background:#04060b}
  .logo .t{font-size:150px;font-weight:600;letter-spacing:-.05em}
  .cta{position:absolute;left:50%;top:820px;transform:translateX(-50%);
    background:var(--accent);color:#fff;font-size:58px;font-weight:700;
    padding:42px 96px;border-radius:99px;white-space:nowrap;
    box-shadow:0 44px 120px rgba(50,145,255,.72)}

  #flash{position:absolute;inset:0;background:#cfe2ff;opacity:0;z-index:70;pointer-events:none}
  #vig{position:absolute;inset:0;z-index:50;pointer-events:none;
    background:radial-gradient(130% 95% at 50% 44%,transparent 46%,rgba(0,0,0,.82) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="orb" id="o1" style="width:1300px;height:1300px;background:rgba(50,145,255,.34)"></div>
  <div class="orb" id="o2" style="width:1000px;height:1000px;background:rgba(0,120,255,.20)"></div>

  <div class="badge" id="badge">Pinlane</div>
  <div id="scene"></div>
  <div id="subs"></div>
  <div id="sweep"></div>
  <div id="vig"></div>
  <div id="flash"></div>
</div>

<script>
// ===========================================================================
// LE MONTAGE EST ESCLAVE DE LA VOIX.
// Les bornes ci-dessous ne sont pas choisies a l'oreille : elles sortent de
// `ffmpeg silencedetect` sur voix-promo.mp3. Chaque plan change exactement sur
// une respiration du comedien, donc l'image tombe toujours sur le mot.
//   0.00-0.50 Samedi | 0.85-1.25 complet | 1.72-2.23 Mardi | 2.41-2.82 vide
//   3.41-4.80 Personne ne rappelle vos clients
//   5.39-6.86 Pinlane reunit planning | 7.04-7.41 clients | 7.77-8.35 et relances
//   8.59-9.49 dans un seul outil
//   10.06-11.31 Un agent qui vend pour vous | 11.65-12.46 et qui le prouve
//   13.15-13.75 Pinlane | 14.06-15.08 Demandez votre demo
// ===========================================================================
const DUR = 15.6;
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eQuint = (x) => 1 - Math.pow(1 - x, 5);
const eInOut = (x) => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const eBack = (x) => { const c = 2.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

const LINES = [
  { a: 0.05, b: 1.66, t: 'Samedi : COMPLET.', hi: ['COMPLET.'] },
  { a: 1.72, b: 3.34, t: 'Mardi : VIDE.', bad: ['VIDE.'] },
  { a: 3.41, b: 5.30, t: 'PERSONNE ne rappelle vos clients.', bad: ['PERSONNE'] },
  { a: 5.39, b: 9.96, t: 'Planning, clients, relances : UN SEUL OUTIL.', hi: ['UN', 'SEUL', 'OUTIL.'] },
  { a: 10.06, b: 13.05, t: 'Un agent qui vend. Et qui le PROUVE.', win: ['PROUVE.'] },
  { a: 13.15, b: 15.6, t: 'Demandez votre démo.', hi: ['démo.'] },
];

// 9 plans en 15,6 s. La rafale du milieu (a4-a7) change d'image tous les
// ~0,8 s, sur chaque mot de l'enumeration.
const ACTS = [
  ['a1',  0.00,  1.72], ['a2',  1.72,  3.41], ['a3',  3.41,  5.39],
  ['a4',  5.39,  7.04], ['a5',  7.04,  7.77], ['a6',  7.77,  8.59],
  ['a7',  8.59, 10.06], ['a8', 10.06, 13.15], ['a9', 13.15, DUR],
];
const curAct = (t) => ACTS.find(([, a, b]) => t >= a && t < b) || ACTS[ACTS.length - 1];

// Clips d'interaction REELLE en 4K : source video, pas image fixe.
const CLIP = { staff: '../../artifacts/promo-clips/staff.webm', client: '../../artifacts/promo-clips/client.webm' };

// Fenetres UTILES de chaque clip, relevees sur planche-contact. Scruber en
// dehors donnerait un ecran de chargement ou une page sans contenu.
//   staff  : 0-3 planning · 3-4.4 reservations · 4.6-7.4 clients
//            7.6-9.2 emails · 12.8-15.4 planning · 15.5-17.5 resa ouverte
//   client : 0-3.4 formulaire · 4.2-7 formules · 7.5-11 duree

let built = '';
function build(key, html) {
  if (built === key) return;
  $('scene').innerHTML = html;
  built = key;
  // Les <video> doivent etre pretes AVANT qu'on les scrube : sans ca les
  // premieres frames sortent noires.
  $('scene').querySelectorAll('video').forEach((v) => { v.muted = true; v.preload = 'auto'; v.load(); });
}

// Les clips en attente de repositionnement. Le rendu ne capture pas tant que
// cette liste n'est pas vide : sinon la premiere frame d'un acte sort sur une
// carte vide (la <video> vient d'etre creee, rien n'est encore peint).
let WAIT = [];
function seekTo(v, time) {
  WAIT.push(v);
  const done = () => { WAIT = WAIT.filter((x) => x !== v); };
  v.addEventListener('seeked', done, { once: true });
  v.addEventListener('error', done, { once: true });
  try { v.currentTime = time; } catch (e) { done(); }
}
function scrub(sel, time) {
  const v = document.querySelector(sel);
  if (!v) return;
  // Sur la premiere frame d'un acte la <video> vient d'etre creee : un
  // currentTime pose avant les metadonnees est ignore, et le plan s'ouvrirait
  // sur la seconde 0 du clip. On repousse la demande apres loadedmetadata.
  if (v.readyState < 1) {
    WAIT.push(v);
    v.addEventListener('loadedmetadata', () => {
      WAIT = WAIT.filter((x) => x !== v);
      seekTo(v, time);
    }, { once: true });
    return;
  }
  if (Math.abs(v.currentTime - time) > 0.02) seekTo(v, time);
}
// Contrat avec render.js : true = tout est peint, on peut capturer.
window.SCRUB_SETTLED = () => WAIT.length === 0
  && [...document.querySelectorAll('video')].every((v) => v.readyState >= 2 && !v.seeking);

// zoom/oy : le parcours client est une colonne centree, plus etroite que le
// format 16/9. Sans zoom, la carte affiche deux bandes noires sur les cotes et
// on croit a un mauvais recadrage. On agrandit donc dans le clip pour que la
// colonne remplisse la carte, quitte a rogner en haut et en bas.
function card(id, x, y, w, h, clip, zoom = 1.06, oy = -0.03) {
  const vw = Math.round(w * zoom);
  return `<div class="card" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <video id="${id}v" src="${clip}" style="width:${vw}px;left:${Math.round((w - vw) / 2)}px;top:${Math.round(h * oy)}px"></video></div>`;
}

function place(id, opts) {
  const el = $(id); if (!el) return;
  const { p = 1, rx = 0, ry = 0, rz = 0, sc = 1, dx = 0, dy = 0, z = 0, f = '' } = opts;
  el.style.opacity = p;
  el.style.transform = `translate3d(${dx}px, ${dy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`;
  if (f !== '') el.style.filter = f;
}

function fadeIn(id, t, a, dly, dur, dy) {
  const el = $(id); if (!el) return 0;
  const p = eOut(seg(t, a + dly, a + dly + dur));
  el.style.opacity = p;
  el.style.transform = `translateY(${lerp(dy, 0, p)}px)`;
  return p;
}

// Pastilles : arrivee en surcharge + flottement dephase. Rien n'est fige.
function chip(id, t, a, st, i, side, on) {
  const el = $(id); if (!el) return;
  const p = clamp01(seg(t, st, st + .28));
  const fl = Math.sin((t - a) * 2.2 + i * 1.1) * 8;
  el.style.opacity = p;
  el.style.transform = `translateX(${lerp(110 * side, 0, eBack(p))}px) translateY(${fl}px) scale(${lerp(.78, 1, eBack(p))})`;
  el.classList.toggle('on', !!on);
}

function drawScene(t) {
  const [key, a, b] = curAct(t);
  const d = seg(t, a, b);
  // Respiration continue de la carte : meme sur un plan « fixe », l'image
  // avance. C'est ce qui separe un motion design d'une capture d'ecran.
  const breathe = Math.sin((t - a) * 1.7) * 1.6;

  // ---- A1 / A2 : « Samedi, complet. » puis « Mardi, vide. » -------------
  if (key === 'a1' || key === 'a2') {
    build('b1', card('c1', 300, 210, 1500, 845, CLIP.staff)
      + `<div class="kick" id="k1" style="left:1900px;top:300px">Le planning</div>
         <div class="ttl" id="t1" style="left:1900px;top:350px;font-size:96px;width:560px">Votre<br>journée</div>
         <div class="chipf" id="ch1" style="left:1880px;top:640px"><span class="dot"></span>8 pistes</div>
         <div class="chipf g" id="ch2" style="left:1880px;top:760px"><span class="dot"></span>38 joueurs</div>
         <div class="chipf" id="ch3" style="left:1880px;top:880px"><span class="dot"></span>601 EUR</div>`);
    if (key === 'a1') {
      scrub('#c1v', 0.4 + d * 1.4);
      place('c1', {
        ry: lerp(15, 7, eInOut(d)), rx: lerp(6, 2.5, eInOut(d)), rz: lerp(-2.6, -1.2, eInOut(d)),
        sc: lerp(.93, 1.0, eQuint(seg(t, a, a + .5))) + d * .03,
        dx: lerp(-70, 0, eQuint(seg(t, a, a + .5))), dy: lerp(40, -16, d) + breathe,
      });
      ['k1', 't1'].forEach((id, i) => fadeIn(id, t, a, .04 + i * .07, .26, 40));
      [['ch1', 0], ['ch2', 1], ['ch3', 2]].forEach(([id, i]) => chip(id, t, a, a + .2 + i * .1, i, 1, false));
    } else {
      // « Mardi, vide. » : le meme centre, mais l'image se vide de sa couleur
      // et recule. Aucun chiffre invente — c'est la lumiere qui raconte.
      scrub('#c1v', 1.8 + d * 1.0);
      const drain = eOut(seg(t, a, a + .55));
      place('c1', {
        ry: lerp(-6, -13, eInOut(d)), rx: 3, rz: lerp(1, 2.4, d),
        sc: lerp(1.0, .84, eOut(seg(t, a, a + .5))), dy: lerp(-16, 24, d) + breathe,
        z: lerp(0, -260, eOut(seg(t, a, a + .5))),
        f: `saturate(${lerp(1, .18, drain).toFixed(2)}) brightness(${lerp(1, .52, drain).toFixed(2)})`,
      });
      ['k1', 't1'].forEach((id) => { const el = $(id); if (el) el.style.opacity = 1 - drain; });
      ['ch1', 'ch2', 'ch3'].forEach((id) => { const el = $(id); if (el) el.style.opacity = (1 - drain) * .5; });
    }
  }

  // ---- A3 : « Personne ne rappelle vos clients. » -----------------------
  if (key === 'a3') {
    build('b2', card('c1', 170, 300, 1180, 664, CLIP.staff)
      + card('c2', 1190, 470, 1180, 664, CLIP.client, 1.9, -0.30)
      + `<div class="ttl" id="t3" style="left:180px;top:140px;font-size:104px">Ils viennent<br>une fois.</div>`);
    scrub('#c1v', 7.7 + d * 1.2);          // Emails & relances
    scrub('#c2v', 0.6 + d * 2.4);          // le formulaire client
    place('c1', { ry: 13, rx: 4, rz: -2.2,
      sc: lerp(.9, .97, eQuint(seg(t, a, a + .4))),
      dx: lerp(-70, 0, eQuint(seg(t, a, a + .4))), dy: lerp(24, -22, d) + breathe, z: -120 });
    const p2 = eQuint(seg(t, a + .22, a + .52));
    place('c2', { p: clamp01(seg(t, a + .20, a + .30)), ry: -11, rx: -3, rz: 1.8,
      sc: lerp(.84, 1.0, p2), dx: lerp(150, 0, p2), dy: lerp(52, -12, d) - breathe, z: 70 });
    fadeIn('t3', t, a, .04, .3, 46);
  }

  // ---- A4 a A7 : LA RAFALE. Une image par mot de l'enumeration ----------
  // Meme construction pour les quatre : le DOM n'est pas detruit entre les
  // plans, seule la mise en scene bouge. Zero risque de trou a la coupe.
  if (key === 'a4' || key === 'a5' || key === 'a6' || key === 'a7') {
    build('b3', card('c1', 520, 250, 1420, 799, CLIP.staff)
      + card('c2', 700, 330, 1240, 698, CLIP.client, 1.9, -0.34)
      + `<div class="kick" id="k4" style="left:520px;top:170px">Un seul outil</div>
         <div class="chipf" id="q0" style="left:150px;top:420px"><span class="dot"></span>Planning</div>
         <div class="chipf" id="q1" style="left:150px;top:560px"><span class="dot"></span>Clients</div>
         <div class="chipf" id="q2" style="left:2020px;top:420px"><span class="dot"></span>Relances</div>
         <div class="chipf g" id="q3" style="left:2020px;top:560px"><span class="dot"></span>Formules</div>`);

    // Chaque plan : ou est la carte, quel moment du clip, quelle pastille.
    const SHOT = {
      a4: { v: '#c1v', from: 12.9, to: 14.2, ry: 11, rz: -1.8, sc: 1.00, dx: -60, on: 'q0' },
      a5: { v: '#c1v', from: 4.8, to: 6.6, ry: -12, rz: 2.0, sc: .93, dx: 90, on: 'q1' },
      a6: { v: '#c1v', from: 7.7, to: 8.9, ry: 9, rz: -2.4, sc: .88, dx: -110, on: 'q2' },
      a7: { v: '#c2v', from: 4.4, to: 6.6, ry: -7, rz: 1.2, sc: 1.02, dx: 30, on: 'q3' },
    }[key];
    scrub(SHOT.v, SHOT.from + d * (SHOT.to - SHOT.from));
    const isClient = SHOT.v === '#c2v';
    // Entree en surcharge a chaque plan : la carte arrive PLEINE (coupe
    // franche) mais depasse legerement sa position avant de se poser.
    const land = eBack(clamp01(seg(t, a, a + .3)));
    const common = { rx: 3, dy: lerp(26, -14, d) + breathe };
    place('c1', { ...common, p: isClient ? 0 : 1,
      ry: SHOT.ry, rz: SHOT.rz, sc: (isClient ? .9 : SHOT.sc) * lerp(1.06, 1, land) + d * .02,
      dx: isClient ? 0 : lerp(SHOT.dx * 1.5, SHOT.dx, land) });
    place('c2', { ...common, p: isClient ? 1 : 0,
      ry: SHOT.ry, rz: SHOT.rz, sc: (isClient ? SHOT.sc : .9) * lerp(1.06, 1, land) + d * .02,
      dx: isClient ? lerp(SHOT.dx * 1.5, SHOT.dx, land) : 0 });

    // Le kicker n'apparait qu'au dernier temps, sur « un seul outil ».
    const k = $('k4');
    if (k) { const p = key === 'a7' ? eOut(seg(t, a + .05, a + .3)) : 0; k.style.opacity = p; k.style.transform = `translateY(${lerp(26, 0, p)}px)`; }
    // Les pastilles s'empilent au fil de l'enumeration et restent allumees.
    [['q0', 5.45, -1], ['q1', 7.08, -1], ['q2', 7.81, 1], ['q3', 8.63, 1]].forEach(([id, st, side], i) => {
      chip(id, t, a, st, i, side, SHOT.on === id);
    });
  }

  // ---- A8 : « Un agent qui vend, et qui le prouve. » --------------------
  if (key === 'a8') {
    build('b4', card('c1', 1150, 360, 1280, 720, CLIP.staff)
      + `<div class="kpi" id="kp" style="left:190px;top:460px"><div class="n" id="kn">0</div>
           <div class="u">chiffre du jour, compté en direct</div></div>`);
    scrub('#c1v', 15.4 + d * 1.7);        // la fiche reservation ouverte
    place('c1', { p: .95, ry: -13, rx: 4, rz: 2,
      sc: lerp(.9, .97, eQuint(seg(t, a, a + .4))),
      dx: lerp(120, 0, eQuint(seg(t, a, a + .4))), dy: lerp(34, -18, d) + breathe, z: -70 });
    const kp = $('kp'), kn = $('kn');
    if (kp && kn) {
      const p = clamp01(seg(t, a + .05, a + .3));
      kp.style.opacity = p;
      kp.style.transform = `translateX(${lerp(-70, 0, eBack(p))}px) scale(${lerp(.82, 1, eBack(p))})`;
      // 601 EUR : le chiffre REELLEMENT affiche par le produit dans ce plan.
      // Aucun resultat client invente.
      const c = eOut(seg(t, a + .2, a + 1.7));
      kn.textContent = Math.round(lerp(0, 601, c)) + ' EUR';
    }
  }

  // ---- A9 : fermeture de marque ----------------------------------------
  if (key === 'a9') {
    build('b5', `<div class="logo" id="lg"><div class="m"></div><div class="t">Pinlane</div></div>
      <div class="cta" id="cb">Réserver une démo</div>`);
    if (t - a < .16) $('flash').style.opacity = (1 - (t - a) / .16) * .9;
    const lg = $('lg'), cb = $('cb');
    if (lg) { const p = eQuint(seg(t, a, a + .38)); lg.style.opacity = p; lg.style.transform = `translateX(-50%) scale(${lerp(1.45, 1, p)})`; }
    if (cb) {
      const p = clamp01(seg(t, a + .82, a + 1.1));   // arrive sur « Demandez »
      cb.style.opacity = p;
      const br = 1 + Math.sin((t - a) * 4.6) * .026;
      cb.style.transform = `translateX(-50%) scale(${lerp(.72, 1, eBack(p)) * br})`;
    }
  }
}

let subKey = '';
function drawSubs(t) {
  const L = LINES.find((l) => t >= l.a - .1 && t < l.b + .3);
  const host = $('subs');
  if (!L) { host.style.opacity = 0; return; }
  if (subKey !== String(L.a)) {
    host.innerHTML = L.t.split(' ').map((w) => {
      const c = (L.hi || []).includes(w) ? ' hi' : (L.win || []).includes(w) ? ' win' : (L.bad || []).includes(w) ? ' bad' : '';
      return `<span class="w${c}">${w}</span>`;
    }).join('');
    subKey = String(L.a);
  }
  const words = [...host.children];
  const span = Math.max(.3, (L.b - L.a) * .62);
  words.forEach((el, i) => {
    const st = L.a + (i / Math.max(1, words.length)) * span;
    const p = clamp01(seg(t, st, st + .12));
    el.style.opacity = Math.min(1, p * 3);
    el.style.transform = `translateY(${lerp(34, 0, eBack(p))}px) scale(${lerp(.8, 1, eBack(p))})`;
  });
  const out = seg(t, L.b + .04, L.b + .3);
  host.style.opacity = 1 - out;
  host.style.transform = `translateY(${lerp(0, -30, out)}px)`;
}

function render(t) {
  $('flash').style.opacity = 0;
  $('badge').style.opacity = .4 + Math.sin(t * 1.7) * .12;
  $('o1').style.transform = `translate(${400 + Math.sin(t * .52) * 460}px, ${-160 + Math.cos(t * .41) * 280}px)`;
  $('o2').style.transform = `translate(${1500 + Math.cos(t * .46) * 400}px, ${700 + Math.sin(t * .36) * 260}px)`;
  // La grille derive et respire sur le tempo : profondeur d'arriere-plan sans
  // rien couter en lisibilite.
  $('grid').style.transform = `translate(${(t * 22) % 90}px, ${(t * 13) % 90}px)`;
  $('grid').style.opacity = .09 + Math.abs(Math.sin(t * 3.1)) * .05;

  // A chaque coupe : eclair court + barre de lumiere qui traverse. C'est ce
  // qui fait « claquer » le montage au lieu de le subir.
  const cut = ACTS.find(([, s]) => t >= s && t < s + .34 && s > 0);
  if (cut) {
    const u = (t - cut[1]) / .34;
    if (u < .18) $('flash').style.opacity = (1 - u / .18) * .20;
    $('sweep').style.opacity = (1 - u) * .85;
    $('sweep').style.transform = `translateX(${lerp(-500, 2900, eOut(u))}px) skewX(-14deg)`;
  } else {
    $('sweep').style.opacity = 0;
  }

  drawScene(t);
  drawSubs(t);
}
window.renderFrame = render;
window.SCENE_DURATION = DUR;
render(0);
</script>
</body>
