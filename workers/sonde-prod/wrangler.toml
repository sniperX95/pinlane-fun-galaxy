# La sonde de la prod : voir l en-tete de sonde.mjs.
name = "pinlane-sonde"
main = "sonde.mjs"
compatibility_date = "2026-10-01"
# Aucune adresse publique : ce Worker ne vit que par ses crons.
workers_dev = false

[triggers]
# Les passages (minutes 1, 6, 11, 16...) et le bilan du lundi, 8 h ou 9 h a Bruxelles.
crons = ["1-59/5 * * * *", "0 7 * * 1"]

# Garde les journaux des passages trois jours dans le tableau de bord.
[observability]
enabled = true

[[kv_namespaces]]
binding = "ETAT"
id = "2759fa6ed9ac4793860fe4fac5e3d5ad"
