<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direction Fun Galaxy</title>
<link rel="icon" href="./assets/brand/pinlane-mark.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem('pinlane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="preload" href="./assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/pinlane.css?v=geist-v2">
  <link rel="stylesheet" href="./assets/pinlane-client.css?v=20260710a">
</head>
<body class="direction">
  <main class="wrap">
    <section class="top">
      <div>
        <div class="eyebrow">Direction</div>
        <h1>Centre de contrôle</h1>
        <div class="sub">Suivi des confirmations, mails, recommandations IA et signaux terrain. Cette page n’est pas affichée dans le staff opérationnel.</div>
      </div>
      <div class="actions">
        <a class="btn" href="/">Retour planning</a>
        <button class="btn" onclick="loadDirection(true)">Actualiser</button>
        <button class="btn primary" onclick="dispatchQueue(this)">Envoyer la file</button>
      </div>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist" aria-label="Sections de la console direction">
        <button id="tab-communications" class="tab active" role="tab" aria-selected="true" aria-controls="content" onclick="setTab('communications')">Mails</button>
        <button id="tab-samples" class="tab" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" onclick="setTab('samples')">Modèles</button>
        <button id="tab-suggestions" class="tab" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" onclick="setTab('suggestions')">Agents</button>
        <button id="tab-events" class="tab" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" onclick="setTab('events')">Journal</button>
        <button id="tab-simulation" class="tab" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" onclick="setTab('simulation')">Simulation rush</button>
      </div>
      <div id="content" role="tabpanel" tabindex="0" aria-label="Contenu de la section"></div>
    </section>
  </main>

  <script>
    const state = { tab: 'communications', loading: false, loaded: false, communications: [], samples: [], suggestions: [], events: [], simulation: null, simAuto: false, simTimer: null, lastLoadedAt: '', error: '', actionError: '', sectionErrors: {} };
    const api = '/api/ops';
    const simulationApi = '/api/simulation';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const label = template => ({
      request_received: 'Demande reçue',
      confirmation: 'Confirmation',
      reminder_48h: 'Relance',
      staff_review_request: 'Validation direction'
    }[template] || template || 'Message');
    function when(value) {
      if (!value) return 'Non planifié';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Non planifié';
      return date.toLocaleString('fr-BE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    }
    async function json(url, options = {}) {
      const absoluteUrl = new URL(url, window.location.origin).toString();
      const response = await fetch(absoluteUrl, {
        ...options,
        cache: 'no-store',
        headers: { 'Content-Type':'application/json', ...(options.headers || {}) }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.ok === false) {
        const error = new Error(payload.message || 'Action impossible.');
        error.status = response.status;
        throw error;
      }
      return payload;
    }
    const TAB_ORDER = ['communications', 'samples', 'suggestions', 'events', 'simulation'];
    function setTab(tab) {
      state.tab = tab;
      render();
      if (tab === 'simulation') loadSimulationStatus();
    }
    // P2-6 : navigation clavier du tablist — flèches gauche/droite (cycliques),
    // Home/End, roving tabindex (l'onglet actif est le seul tabbable).
    document.querySelector('.tabs').addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const index = TAB_ORDER.indexOf(state.tab);
      let next = index;
      if (event.key === 'ArrowLeft') next = (index + TAB_ORDER.length - 1) % TAB_ORDER.length;
      if (event.key === 'ArrowRight') next = (index + 1) % TAB_ORDER.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = TAB_ORDER.length - 1;
      event.preventDefault();
      setTab(TAB_ORDER[next]);
      document.getElementById(`tab-${TAB_ORDER[next]}`).focus();
    });
    // allSettled : chaque onglet vit avec SES permissions — un rôle partiel
    // (ex. emails.view seul) garde ses onglets légitimes, les autres affichent
    // « Accès restreint » ou « Erreur de chargement » sans tout perdre.
    async function loadDirection(force = false) {
      if (state.loading && !force) return;
      state.loading = true;
      if (!state.loaded) render();
      const sections = ['communications', 'samples', 'suggestions', 'events', 'simulation'];
      const results = await Promise.allSettled([
        json(`${api}?action=communications&centerId=libramont&limit=150`),
        json(`${api}?action=emailSamples`),
        json(`${api}?action=suggestions&centerId=libramont&limit=100`),
        json(`${api}?action=events&centerId=libramont&limit=100`),
        json(`${simulationApi}?action=status&centerId=libramont&date=${simDate()}`)
      ]);
      const sectionErrors = {};
      const read = (index, pick) => {
        const result = results[index];
        if (result.status === 'fulfilled') return pick(result.value);
        sectionErrors[sections[index]] = {
          status: Number(result.reason?.status || 0),
          message: result.reason?.message || 'Erreur de chargement.'
        };
        return null;
      };
      const communications = read(0, payload => payload.communications || []);
      const samples = read(1, payload => payload.samples || []);
      const suggestions = read(2, payload => payload.suggestions || []);
      const events = read(3, payload => payload.events || []);
      const simulation = read(4, payload => payload);
      const allFailed = results.every(result => result.status === 'rejected');
      Object.assign(state, {
        loading: false,
        loaded: state.loaded || !allFailed,
        error: allFailed ? (results[0].reason?.message || 'Console indisponible.') : '',
        sectionErrors,
        communications: communications ?? state.communications,
        samples: samples ?? state.samples,
        suggestions: suggestions ?? state.suggestions,
        events: events ?? state.events,
        simulation: simulation ?? state.simulation,
        lastLoadedAt: allFailed ? state.lastLoadedAt : new Date().toISOString()
      });
      render();
    }
    function visibleCommunications() {
      return state.communications.filter(item => item.templateId !== 'sms_future_reminder' && item.channel !== 'phone_note' && !item.payload?.smsDeferred);
    }
    function stats(list = visibleCommunications()) {
      const queued = list.filter(x => x.status === 'queued').length;
      const sent = list.filter(x => ['sent','delivered'].includes(x.status)).length;
      const failed = list.filter(x => x.status === 'failed').length;
      const review = list.filter(x => x.templateId === 'staff_review_request').length;
      return `<div class="grid">
        <div class="stat"><div class="k">En file</div><div class="v">${queued}</div></div>
        <div class="stat"><div class="k">Envoyés</div><div class="v">${sent}</div></div>
        <div class="stat"><div class="k">Erreurs</div><div class="v">${failed}</div></div>
        <div class="stat"><div class="k">Cas sensibles</div><div class="v">${review}</div></div>
      </div>`;
    }
    function renderCommunications() {
      const communications = visibleCommunications();
      if (!communications.length) return '<div class="empty">Aucun message pour le moment.</div>';
      return `${stats(communications)}<div class="list">${communications.map((item, index) => `
        <div class="row">
          <div><span class="pill ${esc(item.status)}">${esc(item.status)}</span><div class="meta">${esc(when(item.scheduledAt || item.createdAt))}</div></div>
          <div><div class="title">${esc(item.subject || label(item.templateId))}</div><div class="meta">${esc(label(item.templateId))} • ${esc(item.channel)}</div></div>
          <div class="meta">${esc(item.recipient || 'Destinataire manquant')}<br>${item.lastError ? esc(item.lastError) : `${Number(item.attempts || 0)} tentative(s)`}</div>
          <button class="mini" onclick="preview(${index}, 'communication-visible')">Voir</button>
        </div>`).join('')}</div>`;
    }
    function renderSamples() {
      return `<div class="list">${state.samples.map((item, index) => `
        <div class="row template">
          <div><span class="pill">${esc(label(item.templateId))}</span><div class="meta">Aperçu</div></div>
          <div><div class="title">${esc(item.subject)}</div><div class="meta">${esc(item.preheader || '')}</div></div>
          <button class="mini" onclick="preview(${index}, 'sample')">Voir</button>
        </div>`).join('')}</div>`;
    }
    // P3-3 : libellé FR de repli quand l'agent n'a pas fourni de titre —
    // jamais l'ID technique brut (duration_adjustment…) à l'écran.
    const suggestionLabel = type => ({
      duration_adjustment: 'Ajustement de durée recommandé',
      marketing_script: 'Script marketing proposé',
      orchestrator_action: 'Action orchestrateur'
    }[type] || 'Recommandation agent');
    function renderSuggestions() {
      if (!state.suggestions.length) return '<div class="empty">Aucune recommandation active. Les agents en créeront après incidents, retards ou anomalies répétées.</div>';
      return `<div class="list">${state.suggestions.map(item => {
        const payload = item.payload || {};
        return `<div class="row">
          <div><span class="pill ${esc(item.severity)}">${esc(item.severity)}</span><div class="meta">Confiance ${Math.round(Number(item.confidence || 0) * 100)}%</div></div>
          <div><div class="title">${esc(payload.title || suggestionLabel(item.suggestionType))}</div><div class="meta">${esc(item.agentId)} • ${esc(item.status)}</div></div>
          <div class="meta">${esc(payload.recommendation || payload.reason || payload.message || 'À examiner.')}</div>
          <span class="pill">Agent</span>
        </div>`;
      }).join('')}</div>`;
    }
    function renderEvents() {
      if (!state.events.length) return '<div class="empty">Journal vide. Les retards, bugs laser/bowling et no-shows apparaîtront ici.</div>';
      return `<div class="list">${state.events.map(item => `<div class="row">
        <div><span class="pill">${esc(item.eventType)}</span><div class="meta">${esc(when(item.createdAt))}</div></div>
        <div><div class="title">${esc(item.activityType || item.activityId || 'Opération')}</div><div class="meta">${esc(item.reasonId || 'Signal terrain')}</div></div>
        <div class="meta">${esc(`${item.plannedStart || '--:--'} → ${item.actualEnd || item.actualStart || '--:--'} • ${item.actualMinutes || item.plannedMinutes || 0} min`)}</div>
        <span class="pill">${esc(item.centerId)}</span>
      </div>`).join('')}</div>`;
    }
    function simDate() {
      return new Date().toISOString().slice(0, 10);
    }
    function simStats(stats = {}, run = null) {
      const progress = run?.totalSteps ? Math.round((Number(run.stepIndex || 0) / Number(run.totalSteps || 1)) * 100) : 0;
      return `<div class="grid">
        <div class="stat"><div class="k">Progression</div><div class="v">${run ? `${progress}%` : '--'}</div></div>
        <div class="stat"><div class="k">Créées</div><div class="v">${Number(stats.created || 0)}</div></div>
        <div class="stat"><div class="k">Refus limites</div><div class="v">${Number(stats.refused || 0)}</div></div>
        <div class="stat"><div class="k">Retards</div><div class="v">${Number(stats.delays || 0)}</div></div>
        <div class="stat"><div class="k">Mails brouillons</div><div class="v">${Number(stats.mailsDrafted || 0)}</div></div>
        <div class="stat"><div class="k">Jours couverts</div><div class="v">${Number(stats.daysCovered || 0)}</div></div>
        <div class="stat"><div class="k">Orchestrations</div><div class="v">${Number(stats.orchestrations || 0)}</div></div>
        <div class="stat"><div class="k">Erreurs moteur</div><div class="v">${Number(stats.errors || 0)}</div></div>
      </div>`;
    }
    function renderSimulation() {
      const payload = state.simulation || {};
      const run = payload.run || null;
      const stats = payload.stats || run?.payload?.stats || {};
      const logs = payload.logs || [];
      const timeline = run?.payload?.timeline || [];
      const progress = run?.totalSteps ? Math.round((Number(run.stepIndex || 0) / Number(run.totalSteps || 1)) * 100) : 0;
      const status = run?.status || 'idle';
      return `<div class="sim-layout">
        <div class="sim-card">
          <span class="pill ${esc(status)}">${esc(status === 'running' ? 'en cours' : status === 'finished' ? 'terminée' : 'prête')}</span>
          <h3>Rush accéléré</h3>
          <p>Réservations client et staff, bowling, laser, formules, retards, refus limites et mails en brouillon. Aucune simulation n’est envoyée aux vrais clients.</p>
          <div class="sim-progress"><span style="width:${progress}%"></span></div>
          <p>${run ? `${run.stepIndex}/${run.totalSteps} actions · ${esc(run.simDate)}` : `Aucun run actif pour ${esc(simDate())}.`}</p>
          <div class="sim-actions">
            ${run?.status === 'running' ? `<button class="btn primary" onclick="stepSimulation(8)">Avancer 8</button><button class="btn" onclick="${state.simAuto ? 'stopSimulationAuto()' : 'resumeSimulationAuto()'}">${state.simAuto ? 'Pause auto' : 'Lecture auto'}</button>` : `<button class="btn primary" onclick="startSimulation(this)">Lancer simulation</button>`}
            <button class="btn" onclick="stepSimulation(24)">Burst 24</button>
            <button class="btn" onclick="resetSimulation(this)">Reset</button>
          </div>
        </div>
        <div class="sim-card">
          <span class="pill">Pilote terrain</span>
          <h3>Logs de décision</h3>
          <p>Chaque action laisse une trace: accepté, refusé, retard absorbé, conflit et lecture orchestrateur.</p>
        </div>
      </div>
      ${simStats(stats, run)}
      <div class="sim-layout">
        <div class="sim-card"><h3>Timeline</h3><div class="sim-timeline">${timeline.length ? timeline.slice(-10).reverse().map(item => `<div><strong>${esc(item.label || item.kind)}</strong><span>${esc(`${item.kind || 'event'} · minute ${item.minute ?? '--'} · ${item.detail || ''}`)}</span></div>`).join('') : '<p>Aucune action jouée.</p>'}</div></div>
        <div class="sim-card"><h3>Décisions récentes</h3>${logs.length ? logs.slice(0, 10).map(log => `<div class="sim-log"><div><span class="pill ${esc(log.severity)}">${esc(log.severity)}</span><div class="meta">${esc(when(log.createdAt))}</div></div><div><div class="title">${esc(log.decisionType)}</div><div class="meta">${esc(log.payload?.summary || log.payload?.error || log.payload?.action || 'Décision journalisée.')}</div></div><div class="meta">${esc(log.agentId)}${log.reservationId ? `<br>#${esc(log.reservationId)}` : ''}</div></div>`).join('') : '<p>Aucun log.</p>'}</div>
      </div>`;
    }
    async function loadSimulationStatus() {
      try {
        state.simulation = await json(`${simulationApi}?action=status&centerId=libramont&date=${simDate()}`);
        delete state.sectionErrors.simulation;
        render();
      } catch (error) {}
    }
    async function startSimulation(button) {
      stopSimulationAuto(false);
      if (button) button.disabled = true;
      try {
        state.simulation = await json(simulationApi, { method:'POST', body:JSON.stringify({ action:'start', centerId:'libramont', date:simDate(), resetExisting:true, speedFactor:96 }) });
        state.actionError = '';
        state.simAuto = true;
        render();
        await stepSimulation(12, true);
      } catch (error) {
        stopSimulationAuto(false);
        state.actionError = `Lancement de la simulation impossible : ${error.message}`;
        render();
      } finally {
        if (button) button.disabled = false;
      }
    }
    async function stepSimulation(batchSize = 8, auto = false) {
      const run = state.simulation?.run;
      if (!run?.id || run.status !== 'running') return stopSimulationAuto();
      state.simulation = await json(simulationApi, { method:'POST', body:JSON.stringify({ action:'step', centerId:'libramont', date:run.simDate, runId:run.id, batchSize }) });
      render();
      if (state.simulation.run?.status === 'running' && state.simAuto) scheduleSimulationAuto();
      else stopSimulationAuto(false);
    }
    function scheduleSimulationAuto() {
      clearTimeout(state.simTimer);
      if (!state.simAuto) return;
      state.simTimer = setTimeout(() => stepSimulation(12, true), 450);
    }
    function resumeSimulationAuto() {
      state.simAuto = true;
      render();
      scheduleSimulationAuto();
    }
    function stopSimulationAuto(renderNow = true) {
      state.simAuto = false;
      clearTimeout(state.simTimer);
      state.simTimer = null;
      if (renderNow) render();
    }
    async function resetSimulation(button) {
      stopSimulationAuto(false);
      const runId = state.simulation?.run?.id || '';
      if (!runId && !confirm('Aucun run de simulation identifié : supprimer TOUTES les données de simulation du centre ?')) return;
      if (button) button.disabled = true;
      try {
        state.simulation = await json(simulationApi, { method:'POST', body:JSON.stringify({ action:'reset', centerId:'libramont', ...(runId ? { runId } : { confirmResetAll: true }) }) });
        state.actionError = '';
        await loadDirection(true);
      } catch (error) {
        state.actionError = `Reset simulation impossible : ${error.message}`;
        render();
      } finally {
        if (button) button.disabled = false;
      }
    }
    function errorBanner() {
      if (state.error) return `<div class="error-banner" role="alert"><span>Console indisponible : ${esc(state.error)}</span><button class="btn" onclick="loadDirection(true)">Réessayer</button></div>`;
      if (state.actionError) return `<div class="error-banner" role="alert"><span>${esc(state.actionError)}</span><button class="btn" onclick="dismissActionError()">Fermer</button></div>`;
      return '';
    }
    function dismissActionError() {
      state.actionError = '';
      render();
    }
    function sectionBanner(tab) {
      const sectionError = state.sectionErrors[tab];
      if (!sectionError) return '';
      if (sectionError.status === 401 || sectionError.status === 403) {
        return '<div class="empty">Accès restreint : votre rôle ne permet pas de consulter cette section.</div>';
      }
      return `<div class="error-banner" role="alert"><span>Erreur de chargement : ${esc(sectionError.message)}</span><button class="btn" onclick="loadDirection(true)">Réessayer</button></div>`;
    }
    function render() {
      TAB_ORDER.forEach(tab => {
        const button = document.getElementById(`tab-${tab}`);
        const active = state.tab === tab;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', active ? 'true' : 'false');
        button.tabIndex = active ? 0 : -1;
      });
      const content = document.getElementById('content');
      if (state.loading && !state.loaded) {
        content.innerHTML = '<div class="empty">Chargement...</div>';
        return;
      }
      if (!state.loaded) {
        content.innerHTML = errorBanner() || '<div class="empty">Chargement...</div>';
        return;
      }
      const note = state.lastLoadedAt ? `<div class="refresh">Actualisé ${esc(when(state.lastLoadedAt))}</div>` : '';
      const html = sectionBanner(state.tab)
        || (state.tab === 'samples' ? renderSamples() : state.tab === 'suggestions' ? renderSuggestions() : state.tab === 'events' ? renderEvents() : state.tab === 'simulation' ? renderSimulation() : renderCommunications());
      content.innerHTML = errorBanner() + note + html;
    }
    // P2-6 : la modale d'aperçu est un vrai dialog — Échap ferme, focus piégé
    // dans la carte, retour de focus au bouton « Voir » déclencheur.
    let previewTrigger = null;
    function closePreview() {
      const overlay = document.querySelector('.preview');
      if (!overlay) return;
      overlay.remove();
      document.removeEventListener('keydown', handlePreviewKeydown, true);
      if (previewTrigger && document.contains(previewTrigger)) previewTrigger.focus();
      previewTrigger = null;
    }
    function handlePreviewKeydown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        closePreview();
        return;
      }
      if (event.key !== 'Tab') return;
      const overlay = document.querySelector('.preview');
      if (!overlay) return;
      const focusables = [...overlay.querySelectorAll('button, iframe, [tabindex]:not([tabindex="-1"])')];
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (!overlay.contains(document.activeElement)) { event.preventDefault(); first.focus(); }
      else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
    function preview(index, type) {
      const list = type === 'communication-visible'
        ? visibleCommunications()
        : type === 'communication' ? state.communications : state.samples;
      const item = list[index];
      if (!item) return;
      previewTrigger = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      // P3-3 : aucun contenu (html, body et texte vides) → message explicite
      // au lieu d'un <pre> blanc dans l'iframe.
      const textBody = String(item.textBody || '').trim();
      const html = item.html || item.body || (textBody ? `<pre>${esc(textBody)}</pre>` : '');
      const title = item.subject || label(item.templateId);
      const overlay = document.createElement('div');
      overlay.className = 'preview';
      overlay.innerHTML = `<div class="preview-card" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="preview-head"><span>${esc(title)}</span><button class="btn" onclick="closePreview()">Fermer</button></div>
        ${html ? `<iframe sandbox="" title="Aperçu du message" srcdoc="${esc(html)}"></iframe>` : '<div class="empty">Aperçu indisponible.</div>'}
      </div>`;
      overlay.addEventListener('mousedown', event => {
        if (event.target === overlay) closePreview();
      });
      document.addEventListener('keydown', handlePreviewKeydown, true);
      document.body.appendChild(overlay);
      overlay.querySelector('.preview-head button')?.focus();
    }
    async function dispatchQueue(button) {
      if (button) button.disabled = true;
      try {
        const payload = await json(api, { method:'POST', body:JSON.stringify({ action:'dispatchDue', limit:25 }) });
        state.actionError = '';
        await loadDirection(true);
        alert(`${payload.checked || 0} message(s) vérifié(s).`);
      } catch (error) {
        state.actionError = `Envoi de la file impossible : ${error.message}`;
        render();
      } finally {
        if (button) button.disabled = false;
      }
    }
    loadDirection();
    setInterval(() => loadDirection(), 20000);
  </script>
</body>
</html>
