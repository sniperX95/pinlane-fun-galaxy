name: Quality gates

# LA SUITE EN PARTS PARALLELES (2026-10-30). Avant : toute la suite sur UNE
# machine Ubuntu, coupee a 90 min a chaque push sans jamais finir (400 unites
# sur 410 le 29/10), donc sans verdict. Maintenant : le plan (les gates que le
# diff touche, ou toute la suite) se coupe en parts egales (gates-lancer.js
# --parts-ci, puis --partie K/N), jouees en meme temps sur des machines
# Windows, comme le poste ou les gates ont ete ecrits et calibres, a l heure et
# dans la langue du centre ; scripts/gates-assembler.js rend un seul bilan et
# rougit si une part n en a rendu aucun. Le depot est public : ces machines
# ne coutent rien.
#
# Quand :
#   - une etiquette suite-<sha> (scripts/suite-github.js) : la suite d impact
#     d un commit avant de le deployer, depuis son depart sur origin/main ;
#     suite-tout-<sha> : la suite entiere de ce commit ;
#   - un push sur main : l impact de ce qui vient d arriver, sauf si ce commit
#     a deja un passage vert de sa suite entiere (suite-tout-<sha>) : rejouer
#     la meme suite sur le meme commit prenait un quart des machines pour rien
#     (scripts/gates-deja-jouee.js, 2026-11-10) ;
#   - une pull request : l impact depuis sa base ;
#   - chaque nuit : la suite entiere, pour les gates qui derivent du produit ;
#   - a la main : impact ou tout, depart au choix.
#
# SANS LES CONTRE-PREUVES AVANT UNE MISE EN LIGNE (2026-11-10). Une
# contre-preuve casse le produit expres pour verifier que son gate rougit : elle
# eprouve le gate, pas le produit. Elles pesaient 240 des 374 minutes de calcul
# d une suite entiere et se rejouaient a chaque mise en ligne de chaque session
# (14 machines par suite sur les 20 pretees : une file d attente). Tout ce qui
# precede une mise en ligne (suite-<sha>, suite-tout-<sha>, main, pull request)
# joue donc les controles du produit seuls. Les contre-preuves se rejouent
# toutes chaque nuit, sous l etiquette suite-preuves-<sha> (suite-github.js
# --preuves), a la main (mode preuves), et pour le gate que le diff touche.

on:
  push:
    branches: [main]
    tags: ['suite-*']
  pull_request:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: impact (les gates que le diff touche), tout, ou preuves (tout avec les contre-preuves)
        type: choice
        options: [impact, tout, preuves]
        default: impact
      base:
        description: depart de l impact (vide = le depart sur origin/main)
        default: ''

# (l evenement dans le groupe : un push de nuit n annule pas la suite de nuit)
concurrency:
  group: gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Trois gates a la fois par machine (4 coeurs) ; seize machines au plus.
  PLACES: '3'
  PARTS_MAX: '16'

jobs:
  plan:
    runs-on: ubuntu-latest
    # actions: read : relire les passages de ce commit (Deja jouee ?).
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      parts: ${{ steps.plan.outputs.parts }}
      matrice: ${{ steps.plan.outputs.matrice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Un appel en echec ou une reponse illisible ne rendent rien : la suite se joue.
      - name: Deja jouee ?
        id: deja
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          passage=$(gh api "repos/$DEPOT/actions/workflows/quality-gates.yml/runs?head_sha=$COMMIT&per_page=50" 2>/dev/null | node scripts/gates-deja-jouee.js "$COMMIT" || true)
          echo "passage=$passage" >> "$GITHUB_OUTPUT"
          if [ -n "$passage" ]; then echo "La suite entiere de $COMMIT est deja verte (passage $passage) : rien a rejouer."
          else echo "Aucun passage vert de la suite entiere pour $COMMIT : la suite se joue."; fi
      - name: Ce que la suite joue
        id: selection
        shell: bash
        env:
          EVENEMENT: ${{ github.event_name }}
          AVANT: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ inputs.mode }}
          BASE_MAIN: ${{ inputs.base }}
        run: |
          depart() { git merge-base HEAD "$1" 2>/dev/null || echo ""; }
          sel=""
          # Les contre-preuves ne se jouent que la nuit et sur demande
          # (suite-preuves-<sha>, mode preuves) : gates-lancer.js, sansContrePreuves.
          preuves="non"
          case "$EVENEMENT" in
            schedule) sel="--tout"; preuves="oui" ;;
            workflow_dispatch)
              if [ "$MODE" = "preuves" ]; then sel="--tout"; preuves="oui"
              elif [ "$MODE" = "tout" ]; then sel="--tout"
              else b="${BASE_MAIN:-$(depart origin/main)}"; sel="--impact --base $b"; fi ;;
            pull_request) sel="--impact --base $(depart "$BASE_PR")" ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/suite-preuves-*) sel="--tout"; preuves="oui" ;;
                # (--base : les gates que le lot touche gardent leurs contre-preuves)
                refs/tags/suite-tout-*) sel="--tout --base $(depart origin/main)" ;;
                refs/tags/suite-*) sel="--impact --base $(depart origin/main)" ;;
                *)
                  if [ -z "$AVANT" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then sel="--tout"
                  else sel="--impact --base $AVANT"; fi ;;
              esac ;;
          esac
          # Un depart introuvable joue tout plutot que rien.
          case "$sel" in *"--base ") sel="--tout" ;; esac
          if [ "$preuves" = "non" ]; then sel="$sel --sans-contre-preuves"; fi
          echo "selection=$sel" >> "$GITHUB_OUTPUT"
          echo "Selection : $sel"
      - name: Le plan, coupe en parts
        id: plan
        shell: bash
        env:
          DEJA: ${{ steps.deja.outputs.passage }}
        run: |
          if [ -n "$DEJA" ]; then
            { echo "parts=0"; echo "matrice=[]"; } >> "$GITHUB_OUTPUT"
            echo "Suite entiere deja verte sur ce commit (passage $DEJA) : aucune part a jouer." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/gates-lancer.js ${{ steps.selection.outputs.selection }} --parts-ci "$PARTS_MAX" --jobs "$PLACES" | tee plan.txt
          grep -E '^(parts|matrice|unites|estimee)=' plan.txt >> "$GITHUB_OUTPUT"

  parts:
    needs: plan
    if: needs.plan.outputs.parts != '0'
    name: part ${{ matrix.partie }}/${{ needs.plan.outputs.parts }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partie: ${{ fromJSON(needs.plan.outputs.matrice) }}
    steps:
      # LA MACHINE SE TAIT PENDANT LES GATES (2026-10-30). Dix minutes apres son
      # demarrage, chaque machine fait sa maintenance. Defender se met a jour de
      # lui-meme (MsMpEng lance MpCmdRun, qui telecharge la plateforme, redemarre
      # le service et recharge son filtre du systeme de fichiers), et un cliche
      # Volume Shadow Copy arrive avec StorSvc, qui prend un coeur 45 s. Couper
      # Windows Update n a fait que decaler le tout de deux minutes. Tous les
      # processus gelaient jusqu a 60 s (sonde : 8 machines sur 8), et ce qui
      # tombait dans cette fenetre rougissait de lenteur, un second tour pour
      # rien. Machine jetable : rien de cela ne lui sert.
      - name: La machine se tait
        shell: pwsh
        run: |
          foreach ($service in 'wuauserv', 'UsoSvc', 'VSS', 'swprv', 'StorSvc') {
            Stop-Service $service -Force -ErrorAction SilentlyContinue
            Set-Service $service -StartupType Disabled -ErrorAction SilentlyContinue
          }
          foreach ($chemin in '\Microsoft\Windows\WindowsUpdate\', '\Microsoft\Windows\UpdateOrchestrator\') {
            Get-ScheduledTask -TaskPath $chemin -ErrorAction SilentlyContinue | Disable-ScheduledTask -ErrorAction SilentlyContinue | Out-Null
          }
          Set-MpPreference -SignatureFallbackOrder FileShares -ErrorAction SilentlyContinue
          Get-Service wuauserv, UsoSvc, VSS, swprv, StorSvc | ForEach-Object { "$($_.Name) : $($_.Status), $($_.StartType)" }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: L heure et la langue du centre
        shell: pwsh
        run: |
          tzutil /s "Romance Standard Time"
          Set-Culture fr-BE
      - run: npm ci
      # Ce que npm ci n apporte pas, dans la seule part qui le joue
      # (gates-commun.js outilsExternes) : WebKit pour les gates qui lancent
      # ce moteur, poppler (pdftoppm) pour documents-secours, que le Git des
      # machines GitHub n a pas.
      - name: Les outils de la part
        shell: pwsh
        run: |
          $liste = node scripts/gates-lancer.js ${{ needs.plan.outputs.selection }} --partie ${{ matrix.partie }}/${{ needs.plan.outputs.parts }} --jobs $env:PLACES --liste
          $outils = (($liste | Select-String '^outils=(.*)$').Matches.Groups[1].Value) -split ',' | Where-Object { $_ }
          if ($outils -contains 'webkit') { npx playwright-core install webkit; if ($LASTEXITCODE) { exit 1 } }
          # Le binaire fait foi : choco est deja sorti en 0 sans poser pdftoppm.
          if ($outils -contains 'poppler') {
            foreach ($essai in 1..3) {
              $journal = choco install poppler -y --no-progress --force 2>&1
              if (Get-Command pdftoppm -ErrorAction SilentlyContinue) { break }
              "poppler, essai $essai : pdftoppm absent"; $journal | Select-Object -Last 12
              Start-Sleep -Seconds 10
            }
            if (-not (Get-Command pdftoppm -ErrorAction SilentlyContinue)) { exit 1 }
          }
          # LA BASE DE TEST (2026-11-18, point C9 de la note avant-lancement du 16/11). Sept gates
          # lisent PINLANE_TEST_DATABASE_URL et se sautaient partout faute de base. La machine
          # Windows porte un Postgres arrete : il demarre, une base modele recoit toutes les
          # migrations du depot, et le lanceur en donne une copie neuve a chaque unite
          # (gates-lancer.js, baseDeLUnite). Base jetable, mot de passe par defaut de l image.
          if ($outils -contains 'postgres') {
            $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
            if (-not $service) { 'postgres : aucun service sur la machine'; exit 1 }
            Set-Service -InputObject $service -StartupType Manual
            Start-Service -InputObject $service
            $bin = if ($env:PGBIN) { $env:PGBIN } else { Split-Path (Get-Command psql -ErrorAction Stop).Source }
            $env:PATH = "$bin;$env:PATH"
            $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            foreach ($essai in 1..30) { & pg_isready -h localhost -p 5432 | Out-Null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 1 }
            if ($LASTEXITCODE) { 'postgres : le serveur ne repond pas'; exit 1 }
            $utilisateur = if ($env:PGUSER) { $env:PGUSER } else { 'postgres' }
            $motDePasse = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
            $serveur = "postgres://${utilisateur}:${motDePasse}@localhost:5432"
            & psql "$serveur/postgres" -v ON_ERROR_STOP=1 -q -c 'create database pin_modele'
            if ($LASTEXITCODE) { exit 1 }
            $env:DATABASE_URL = "$serveur/pin_modele"
            $env:DATABASE_SSL = 'disable'
            node scripts/run-db-migrations.js
            if ($LASTEXITCODE) { 'postgres : les migrations du modele ont echoue'; exit 1 }
            Remove-Item Env:DATABASE_URL, Env:DATABASE_SSL
            "PINLANE_TEST_DATABASE_URL_MODELE=$serveur/pin_modele" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            & psql --version
          }
          "outils : $(if ($outils) { $outils -join ', ' } else { 'aucun' })"
      # Une unite a 15 min au plus (40 sur le poste) : la plus longue en prend
      # 11 ici, et un gate bloque tenait sa place 40 min puis son second tour,
      # au-dela des 60 min de la part (preprod-csp, le 2026-10-30).
      - name: La part ${{ matrix.partie }}
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PINLANE_GATES_DELAI_S: '900'
        run: node scripts/gates-lancer.js ${{ needs.plan.outputs.selection }} --partie ${{ matrix.partie }}/${{ needs.plan.outputs.parts }} --jobs $env:PLACES --deux-chances
      - name: Son bilan et ses journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.partie }}
          path: ${{ runner.temp }}/pinlane-gates/run-*/
          retention-days: 7
          if-no-files-found: warn

  bilan:
    needs: [plan, parts]
    if: always() && needs.plan.outputs.parts != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Un seul bilan
        run: node scripts/gates-assembler.js parts --parts "${{ needs.plan.outputs.parts }}" --sortie bilan
      - name: Le bilan rassemble
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan
          path: bilan/
          retention-days: 30
