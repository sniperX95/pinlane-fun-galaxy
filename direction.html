<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direction Fun Galaxy</title>
  <link rel="icon" href="./assets/brand/pinlane-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/brand/pinlane-touch-180.png">
  <meta name="robots" content="noindex">
  <!-- Cette page etait le prototype de console direction de l'epoque test :
       hardcodee libramont, orpheline (zero lien vivant dans le produit) et
       doublon date de l'onglet Activite de la vraie console. La console
       Direction vit dans l'application (vue admin du SPA, gate direction.view,
       scope centre par la session). Cette URL est conservee : elle redirige.
       Le Basic Auth direction du middleware reste en place tel quel. -->
  <script>try{var t=localStorage.getItem('pinlane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fafafa;
      color: #0a0a0a;
      font-family: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    :root[data-theme="dark"] body { background: #000; color: #ededed; }
    main { text-align: center; padding: 24px; }
    p { margin: 0; font-size: 14px; line-height: 1.6; }
    a { color: inherit; font-weight: 600; }
  </style>
  <script>window.location.replace('/#admin');</script>
</head>
<body>
  <main>
    <p>La console Direction a déménagé dans l'application.</p>
    <p><a href="/#admin">Ouvrir le cockpit du centre</a></p>
  </main>
</body>
</html>
