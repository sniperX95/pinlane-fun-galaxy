<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direction Fun Galaxy</title>
  <style>
    :root {
      --bg:#0d0e0c;
      --panel:#171915;
      --soft:#1d1f1a;
      --line:rgba(236,229,215,.12);
      --line-2:rgba(236,229,215,.22);
      --text:#f5f1e9;
      --muted:rgba(245,241,233,.62);
      --dim:rgba(245,241,233,.44);
      --gold:#c8ae7c;
      --teal:#8fb8ad;
      --red:#f87171;
      --green:#34d399;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
    }
    button { font:inherit; cursor:pointer; }
    .wrap { width:min(1500px, calc(100vw - 40px)); margin:0 auto; padding:28px 0 42px; }
    .top {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:22px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
    }
    .eyebrow {
      color:var(--gold);
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      font-weight:800;
      margin-bottom:8px;
    }
    h1 { margin:0; font-size:30px; letter-spacing:-.03em; }
    .sub { margin-top:8px; color:var(--muted); font-size:14px; max-width:720px; line-height:1.55; }
    .actions, .tabs { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .btn, .tab {
      min-height:38px;
      padding:0 14px;
      border-radius:10px;
      border:1px solid var(--line);
      background:var(--soft);
      color:var(--text);
      font-size:12px;
      font-weight:800;
    }
    .btn.primary { background:#f4efe4; color:#151511; border-color:transparent; }
    .btn:hover, .tab:hover { border-color:var(--line-2); }
    .tabs { margin:18px 0 14px; }
    .tab.active { border-color:rgba(200,174,124,.46); background:rgba(200,174,124,.12); }
    .panel {
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
    }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
    .stat, .row {
      background:var(--soft);
      border:1px solid var(--line);
      border-radius:14px;
    }
    .stat { padding:14px; }
    .k { color:var(--dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:900; }
    .v { margin-top:8px; font-size:28px; font-weight:900; letter-spacing:-.03em; }
    .list { display:flex; flex-direction:column; gap:8px; }
    .row {
      display:grid;
      grid-template-columns:minmax(120px,.7fr) minmax(260px,1.5fr) minmax(220px,1fr) auto;
      gap:14px;
      align-items:center;
      padding:14px;
    }
    .row.template { grid-template-columns:minmax(150px,.8fr) 1fr auto; }
    .title { font-size:14px; font-weight:900; line-height:1.35; }
    .meta { margin-top:4px; color:var(--muted); font-size:12px; font-weight:650; line-height:1.45; }
    .pill {
      width:max-content;
      min-height:25px;
      display:inline-flex;
      align-items:center;
      padding:0 9px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      font-size:10px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .pill.sent { color:var(--green); border-color:rgba(52,211,153,.28); background:rgba(52,211,153,.08); }
    .pill.queued { color:var(--gold); border-color:rgba(200,174,124,.34); background:rgba(200,174,124,.08); }
    .pill.draft { color:var(--muted); border-color:var(--line); background:rgba(255,255,255,.04); }
    .pill.running { color:var(--gold); border-color:rgba(200,174,124,.34); background:rgba(200,174,124,.08); }
    .pill.finished { color:var(--green); border-color:rgba(52,211,153,.28); background:rgba(52,211,153,.08); }
    .pill.failed, .pill.critical { color:var(--red); border-color:rgba(248,113,113,.30); background:rgba(248,113,113,.08); }
    .pill.high { color:#fca5a5; border-color:rgba(248,113,113,.24); background:rgba(248,113,113,.07); }
    .pill.medium { color:var(--gold); border-color:rgba(200,174,124,.28); background:rgba(200,174,124,.07); }
    .mini {
      min-height:32px;
      padding:0 11px;
      border-radius:9px;
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      font-size:11px;
      font-weight:900;
    }
    .empty {
      padding:42px 18px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:14px;
      background:rgba(255,255,255,.015);
    }
    .refresh { color:var(--dim); font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
    .sim-layout { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
    .sim-card {
      background:var(--soft);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
    }
    .sim-card h3 { margin:8px 0 5px; font-size:17px; letter-spacing:-.02em; }
    .sim-card p { margin:0; color:var(--muted); font-size:13px; line-height:1.5; font-weight:650; }
    .sim-progress { height:9px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid var(--line); overflow:hidden; margin:12px 0 8px; }
    .sim-progress span { display:block; height:100%; background:#f4efe4; width:0%; }
    .sim-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .sim-log { display:grid; grid-template-columns:120px 1fr 220px; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
    .sim-log:first-child { border-top:0; }
    .sim-timeline { display:flex; flex-direction:column; gap:7px; }
    .sim-timeline div { border:1px solid var(--line); border-radius:11px; padding:9px 10px; background:rgba(255,255,255,.02); }
    .sim-timeline strong { display:block; font-size:13px; }
    .sim-timeline span { display:block; margin-top:3px; color:var(--muted); font-size:12px; line-height:1.35; }
    .preview {
      position:fixed;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:rgba(0,0,0,.76);
    }
    .preview-card {
      width:min(760px, 96vw);
      height:min(780px, 88vh);
      background:#f6f2ea;
      color:#1d1b17;
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      border:1px solid var(--line);
    }
    .preview-head {
      background:#11120f;
      color:#fff;
      min-height:54px;
      padding:0 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      font-weight:900;
    }
    .preview iframe { flex:1; border:0; background:#fff; }
    @media(max-width:900px) {
      .wrap { width:min(100vw - 24px, 1500px); padding-top:18px; }
      .top, .row, .row.template { grid-template-columns:1fr; display:flex; flex-direction:column; align-items:stretch; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sim-layout, .sim-log { grid-template-columns:1fr; }
    }

    /* Professional ERP visual pass: neutral, readable, no decorative dashboard effects. */
    :root {
      --bg:#f6f6f3;
      --panel:#ffffff;
      --soft:#fbfbfa;
      --line:#ddddda;
      --line-2:#b9b9b4;
      --text:#1f2328;
      --muted:#5f656d;
      --dim:#858b93;
      --gold:#9a6a16;
      --teal:#1f4f82;
      --red:#b8463c;
      --green:#2f7d4f;
      font-family:"Aptos","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    }
    body {
      background:#f6f6f3;
      color:var(--text);
    }
    .wrap {
      width:min(1540px, calc(100vw - 48px));
      padding:24px 0 36px;
    }
    .top {
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
      margin-bottom:18px;
    }
    .eyebrow {
      color:var(--muted);
      font-size:13px;
      letter-spacing:0;
      text-transform:none;
      font-weight:600;
      margin-bottom:5px;
    }
    h1 {
      font-size:26px;
      font-weight:720;
      letter-spacing:-.02em;
    }
    .sub {
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }
    .btn,
    .tab,
    .mini {
      min-height:36px;
      border-radius:7px;
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--text);
      box-shadow:none;
      font-size:12px;
      font-weight:650;
      letter-spacing:0;
      text-transform:none;
    }
    .btn.primary {
      background:#1f2328;
      color:#ffffff;
      border-color:#1f2328;
    }
    .btn:hover,
    .tab:hover,
    .mini:hover {
      border-color:var(--line-2);
    }
    .tabs {
      margin:0 0 14px;
      padding:4px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#f0f0ed;
      width:max-content;
      max-width:100%;
    }
    .tab.active {
      background:#ffffff;
      color:var(--text);
      border-color:#ffffff;
    }
    .panel,
    .stat,
    .row,
    .sim-card,
    .sim-timeline div {
      background:#ffffff;
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:none;
    }
    .panel {
      padding:16px;
    }
    .grid {
      gap:10px;
    }
    .stat {
      padding:14px;
    }
    .k {
      color:var(--dim);
      font-size:11px;
      letter-spacing:0;
      text-transform:none;
      font-weight:650;
    }
    .v {
      color:var(--text);
      font-size:24px;
      font-weight:720;
      letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;
    }
    .row {
      padding:13px 14px;
      border-radius:8px;
    }
    .title {
      color:var(--text);
      font-size:14px;
      font-weight:700;
    }
    .meta {
      color:var(--muted);
      font-size:12px;
      font-weight:500;
    }
    .pill {
      min-height:22px;
      border-radius:5px;
      border:1px solid var(--line);
      background:#f4f4f1;
      color:var(--muted);
      font-size:10px;
      font-weight:650;
      letter-spacing:0;
      text-transform:none;
    }
    .pill.sent,
    .pill.finished {
      color:#24613c;
      border-color:#b8d7bf;
      background:#edf7ef;
    }
    .pill.queued,
    .pill.running,
    .pill.medium {
      color:#744d0f;
      border-color:#e2c07e;
      background:#fff4df;
    }
    .pill.failed,
    .pill.critical,
    .pill.high {
      color:#8f332b;
      border-color:#dd938b;
      background:#fff0ee;
    }
    .empty {
      border-radius:8px;
      background:#ffffff;
      color:var(--muted);
    }
    .refresh {
      color:var(--dim);
      letter-spacing:0;
      text-transform:none;
      font-weight:600;
    }
    .sim-card h3 {
      color:var(--text);
      font-weight:700;
    }
    .sim-card p,
    .sim-timeline span {
      color:var(--muted);
      font-weight:500;
    }
    .sim-progress {
      border:1px solid var(--line);
      background:#f0f0ed;
    }
    .sim-progress span {
      background:#1f4f82;
    }
    .preview {
      background:rgba(31,35,40,.28);
    }
    .preview-card {
      border-radius:10px;
      border:1px solid var(--line);
      background:#ffffff;
      box-shadow:none;
    }
    .preview-head {
      background:#ffffff;
      color:var(--text);
      border-bottom:1px solid var(--line);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div>
        <div class="eyebrow">Direction</div>
        <h1>Centre de contrôle</h1>
        <div class="sub">Suivi des confirmations, mails, recommandations IA et signaux terrain. Cette page n’est pas affichée dans le staff opérationnel.</div>
      </div>
      <div class="actions">
        <a class="btn" href="/">Retour planning</a>
        <button class="btn" onclick="loadDirection(true)">Actualiser</button>
        <button class="btn primary" onclick="dispatchQueue()">Envoyer la file</button>
      </div>
    </section>

    <section class="panel">
      <div class="tabs">
        <button id="tab-communications" class="tab active" onclick="setTab('communications')">Mails</button>
        <button id="tab-samples" class="tab" onclick="setTab('samples')">Modèles</button>
        <button id="tab-suggestions" class="tab" onclick="setTab('suggestions')">Agents</button>
        <button id="tab-events" class="tab" onclick="setTab('events')">Journal</button>
        <button id="tab-simulation" class="tab" onclick="setTab('simulation')">Simulation rush</button>
      </div>
      <div id="content"></div>
    </section>
  </main>

  <script>
    const state = { tab: 'communications', loading: false, loaded: false, communications: [], samples: [], suggestions: [], events: [], simulation: null, simAuto: false, simTimer: null, lastLoadedAt: '' };
    const api = '/api/ops';
    const simulationApi = '/api/simulation';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const label = template => ({
      request_received: 'Demande reçue',
      confirmation: 'Confirmation',
      reminder_48h: 'Relance',
      staff_review_request: 'Validation direction'
    }[template] || template || 'Message');
    function when(value) {
      if (!value) return 'Non planifié';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Non planifié';
      return date.toLocaleString('fr-BE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    }
    async function json(url, options = {}) {
      const absoluteUrl = new URL(url, window.location.origin).toString();
      const response = await fetch(absoluteUrl, {
        ...options,
        cache: 'no-store',
        headers: { 'Content-Type':'application/json', ...(options.headers || {}) }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.ok === false) throw new Error(payload.message || 'Action impossible.');
      return payload;
    }
    function setTab(tab) {
      state.tab = tab;
      render();
      if (tab === 'simulation') loadSimulationStatus();
    }
    async function loadDirection(force = false) {
      if (state.loading && !force) return;
      state.loading = true;
      if (!state.loaded) render();
      try {
        const [communications, samples, suggestions, events, simulation] = await Promise.all([
          json(`${api}?action=communications&centerId=libramont&limit=150`),
          json(`${api}?action=emailSamples`),
          json(`${api}?action=suggestions&centerId=libramont&limit=100`),
          json(`${api}?action=events&centerId=libramont&limit=100`),
          json(`${simulationApi}?action=status&centerId=libramont&date=${simDate()}`)
        ]);
        Object.assign(state, {
          loading: false,
          loaded: true,
          communications: communications.communications || [],
          samples: samples.samples || [],
          suggestions: suggestions.suggestions || [],
          events: events.events || [],
          simulation,
          lastLoadedAt: new Date().toISOString()
        });
        render();
      } catch (error) {
        state.loading = false;
        document.getElementById('content').innerHTML = `<div class="empty">Console indisponible<br>${esc(error.message)}</div>`;
      }
    }
    function visibleCommunications() {
      return state.communications.filter(item => item.templateId !== 'sms_future_reminder' && item.channel !== 'phone_note' && !item.payload?.smsDeferred);
    }
    function stats(list = visibleCommunications()) {
      const queued = list.filter(x => x.status === 'queued').length;
      const sent = list.filter(x => ['sent','delivered'].includes(x.status)).length;
      const failed = list.filter(x => x.status === 'failed').length;
      const review = list.filter(x => x.templateId === 'staff_review_request').length;
      return `<div class="grid">
        <div class="stat"><div class="k">En file</div><div class="v">${queued}</div></div>
        <div class="stat"><div class="k">Envoyés</div><div class="v">${sent}</div></div>
        <div class="stat"><div class="k">Erreurs</div><div class="v">${failed}</div></div>
        <div class="stat"><div class="k">Cas sensibles</div><div class="v">${review}</div></div>
      </div>`;
    }
    function renderCommunications() {
      const communications = visibleCommunications();
      if (!communications.length) return '<div class="empty">Aucun message pour le moment.</div>';
      return `${stats(communications)}<div class="list">${communications.map((item, index) => `
        <div class="row">
          <div><span class="pill ${esc(item.status)}">${esc(item.status)}</span><div class="meta">${esc(when(item.scheduledAt || item.createdAt))}</div></div>
          <div><div class="title">${esc(item.subject || label(item.templateId))}</div><div class="meta">${esc(label(item.templateId))} • ${esc(item.channel)}</div></div>
          <div class="meta">${esc(item.recipient || 'Destinataire manquant')}<br>${item.lastError ? esc(item.lastError) : `${Number(item.attempts || 0)} tentative(s)`}</div>
          <button class="mini" onclick="preview(${index}, 'communication-visible')">Voir</button>
        </div>`).join('')}</div>`;
    }
    function renderSamples() {
      return `<div class="list">${state.samples.map((item, index) => `
        <div class="row template">
          <div><span class="pill">${esc(label(item.templateId))}</span><div class="meta">Aperçu</div></div>
          <div><div class="title">${esc(item.subject)}</div><div class="meta">${esc(item.preheader || '')}</div></div>
          <button class="mini" onclick="preview(${index}, 'sample')">Voir</button>
        </div>`).join('')}</div>`;
    }
    function renderSuggestions() {
      if (!state.suggestions.length) return '<div class="empty">Aucune recommandation active. Les agents en créeront après incidents, retards ou anomalies répétées.</div>';
      return `<div class="list">${state.suggestions.map(item => {
        const payload = item.payload || {};
        return `<div class="row">
          <div><span class="pill ${esc(item.severity)}">${esc(item.severity)}</span><div class="meta">Confiance ${Math.round(Number(item.confidence || 0) * 100)}%</div></div>
          <div><div class="title">${esc(payload.title || item.suggestionType)}</div><div class="meta">${esc(item.agentId)} • ${esc(item.status)}</div></div>
          <div class="meta">${esc(payload.recommendation || payload.reason || payload.message || 'À examiner.')}</div>
          <span class="pill">Agent</span>
        </div>`;
      }).join('')}</div>`;
    }
    function renderEvents() {
      if (!state.events.length) return '<div class="empty">Journal vide. Les retards, bugs laser/bowling et no-shows apparaîtront ici.</div>';
      return `<div class="list">${state.events.map(item => `<div class="row">
        <div><span class="pill">${esc(item.eventType)}</span><div class="meta">${esc(when(item.createdAt))}</div></div>
        <div><div class="title">${esc(item.activityType || item.activityId || 'Opération')}</div><div class="meta">${esc(item.reasonId || 'Signal terrain')}</div></div>
        <div class="meta">${esc(`${item.plannedStart || '--:--'} → ${item.actualEnd || item.actualStart || '--:--'} • ${item.actualMinutes || item.plannedMinutes || 0} min`)}</div>
        <span class="pill">${esc(item.centerId)}</span>
      </div>`).join('')}</div>`;
    }
    function simDate() {
      return new Date().toISOString().slice(0, 10);
    }
    function simStats(stats = {}, run = null) {
      const progress = run?.totalSteps ? Math.round((Number(run.stepIndex || 0) / Number(run.totalSteps || 1)) * 100) : 0;
      return `<div class="grid">
        <div class="stat"><div class="k">Progression</div><div class="v">${run ? `${progress}%` : '--'}</div></div>
        <div class="stat"><div class="k">Créées</div><div class="v">${Number(stats.created || 0)}</div></div>
        <div class="stat"><div class="k">Refus limites</div><div class="v">${Number(stats.refused || 0)}</div></div>
        <div class="stat"><div class="k">Retards</div><div class="v">${Number(stats.delays || 0)}</div></div>
        <div class="stat"><div class="k">Mails brouillons</div><div class="v">${Number(stats.mailsDrafted || 0)}</div></div>
        <div class="stat"><div class="k">Jours couverts</div><div class="v">${Number(stats.daysCovered || 0)}</div></div>
        <div class="stat"><div class="k">Orchestrations</div><div class="v">${Number(stats.orchestrations || 0)}</div></div>
        <div class="stat"><div class="k">Erreurs moteur</div><div class="v">${Number(stats.errors || 0)}</div></div>
      </div>`;
    }
    function renderSimulation() {
      const payload = state.simulation || {};
      const run = payload.run || null;
      const stats = payload.stats || run?.payload?.stats || {};
      const logs = payload.logs || [];
      const timeline = run?.payload?.timeline || [];
      const progress = run?.totalSteps ? Math.round((Number(run.stepIndex || 0) / Number(run.totalSteps || 1)) * 100) : 0;
      const status = run?.status || 'idle';
      return `<div class="sim-layout">
        <div class="sim-card">
          <span class="pill ${esc(status)}">${esc(status === 'running' ? 'en cours' : status === 'finished' ? 'terminée' : 'prête')}</span>
          <h3>Rush accéléré</h3>
          <p>Réservations client et staff, bowling, laser, formules, retards, refus limites et mails en brouillon. Aucune simulation n’est envoyée aux vrais clients.</p>
          <div class="sim-progress"><span style="width:${progress}%"></span></div>
          <p>${run ? `${run.stepIndex}/${run.totalSteps} actions · ${esc(run.simDate)}` : `Aucun run actif pour ${esc(simDate())}.`}</p>
          <div class="sim-actions">
            ${run?.status === 'running' ? `<button class="btn primary" onclick="stepSimulation(8)">Avancer 8</button><button class="btn" onclick="${state.simAuto ? 'stopSimulationAuto()' : 'resumeSimulationAuto()'}">${state.simAuto ? 'Pause auto' : 'Lecture auto'}</button>` : `<button class="btn primary" onclick="startSimulation()">Lancer simulation</button>`}
            <button class="btn" onclick="stepSimulation(24)">Burst 24</button>
            <button class="btn" onclick="resetSimulation()">Reset</button>
          </div>
        </div>
        <div class="sim-card">
          <span class="pill">Pilote terrain</span>
          <h3>Logs de décision</h3>
          <p>Chaque action laisse une trace: accepté, refusé, retard absorbé, conflit et lecture orchestrateur.</p>
        </div>
      </div>
      ${simStats(stats, run)}
      <div class="sim-layout">
        <div class="sim-card"><h3>Timeline</h3><div class="sim-timeline">${timeline.length ? timeline.slice(-10).reverse().map(item => `<div><strong>${esc(item.label || item.kind)}</strong><span>${esc(`${item.kind || 'event'} · minute ${item.minute ?? '--'} · ${item.detail || ''}`)}</span></div>`).join('') : '<p>Aucune action jouée.</p>'}</div></div>
        <div class="sim-card"><h3>Décisions récentes</h3>${logs.length ? logs.slice(0, 10).map(log => `<div class="sim-log"><div><span class="pill ${esc(log.severity)}">${esc(log.severity)}</span><div class="meta">${esc(when(log.createdAt))}</div></div><div><div class="title">${esc(log.decisionType)}</div><div class="meta">${esc(log.payload?.summary || log.payload?.error || log.payload?.action || 'Décision journalisée.')}</div></div><div class="meta">${esc(log.agentId)}${log.reservationId ? `<br>#${esc(log.reservationId)}` : ''}</div></div>`).join('') : '<p>Aucun log.</p>'}</div>
      </div>`;
    }
    async function loadSimulationStatus() {
      try {
        state.simulation = await json(`${simulationApi}?action=status&centerId=libramont&date=${simDate()}`);
        render();
      } catch (error) {}
    }
    async function startSimulation() {
      stopSimulationAuto(false);
      state.simulation = await json(simulationApi, { method:'POST', body:JSON.stringify({ action:'start', centerId:'libramont', date:simDate(), resetExisting:true, speedFactor:96 }) });
      state.simAuto = true;
      render();
      await stepSimulation(12, true);
    }
    async function stepSimulation(batchSize = 8, auto = false) {
      const run = state.simulation?.run;
      if (!run?.id || run.status !== 'running') return stopSimulationAuto();
      state.simulation = await json(simulationApi, { method:'POST', body:JSON.stringify({ action:'step', centerId:'libramont', date:run.simDate, runId:run.id, batchSize }) });
      render();
      if (state.simulation.run?.status === 'running' && state.simAuto) scheduleSimulationAuto();
      else stopSimulationAuto(false);
    }
    function scheduleSimulationAuto() {
      clearTimeout(state.simTimer);
      if (!state.simAuto) return;
      state.simTimer = setTimeout(() => stepSimulation(12, true), 450);
    }
    function resumeSimulationAuto() {
      state.simAuto = true;
      render();
      scheduleSimulationAuto();
    }
    function stopSimulationAuto(renderNow = true) {
      state.simAuto = false;
      clearTimeout(state.simTimer);
      state.simTimer = null;
      if (renderNow) render();
    }
    async function resetSimulation() {
      stopSimulationAuto(false);
      state.simulation = await json(simulationApi, { method:'POST', body:JSON.stringify({ action:'reset', centerId:'libramont' }) });
      await loadDirection(true);
    }
    function render() {
      ['communications','samples','suggestions','events','simulation'].forEach(tab => document.getElementById(`tab-${tab}`).classList.toggle('active', state.tab === tab));
      const content = document.getElementById('content');
      if (state.loading && !state.loaded) {
        content.innerHTML = '<div class="empty">Chargement...</div>';
        return;
      }
      const note = state.lastLoadedAt ? `<div class="refresh">Actualisé ${esc(when(state.lastLoadedAt))}</div>` : '';
      const html = state.tab === 'samples' ? renderSamples() : state.tab === 'suggestions' ? renderSuggestions() : state.tab === 'events' ? renderEvents() : state.tab === 'simulation' ? renderSimulation() : renderCommunications();
      content.innerHTML = note + html;
    }
    function preview(index, type) {
      const list = type === 'communication-visible'
        ? visibleCommunications()
        : type === 'communication' ? state.communications : state.samples;
      const item = list[index];
      if (!item) return;
      const html = item.html || item.body || `<pre>${esc(item.textBody || '')}</pre>`;
      const overlay = document.createElement('div');
      overlay.className = 'preview';
      overlay.innerHTML = `<div class="preview-card">
        <div class="preview-head"><span>${esc(item.subject || label(item.templateId))}</span><button class="btn" onclick="this.closest('.preview').remove()">Fermer</button></div>
        <iframe sandbox="" srcdoc="${esc(html)}"></iframe>
      </div>`;
      document.body.appendChild(overlay);
    }
    async function dispatchQueue() {
      const payload = await json(api, { method:'POST', body:JSON.stringify({ action:'dispatchDue', limit:25 }) });
      await loadDirection(true);
      alert(`${payload.checked || 0} message(s) vérifié(s).`);
    }
    loadDirection();
    setInterval(() => loadDirection(), 20000);
  </script>
</body>
</html>
