<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <title>Fun Galaxy — Gembloux · La carte</title>
  <meta name="description" content="La carte bar & snacks de Fun Galaxy Gembloux.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preload" href="../assets/fonts/montserrat-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/logo-fun-galaxy.svg" as="image">
  <link rel="preload" href="./carte-1.jpg" as="image">
  <link rel="stylesheet" href="../assets/viewer.css">
</head>
<body class="pre">
  <!-- Fond spatial vivant (partagé entrée + carte) -->
  <canvas class="space" id="space" aria-hidden="true"></canvas>

  <!-- Visionneuse : en-tête + carte encadrée + barre de contrôle -->
  <div class="viewer" id="viewer">
    <header class="card-head">
      <img class="card-head__logo" src="../assets/logo-fun-galaxy.svg" alt="Fun Galaxy" width="140" height="95">
      <span class="card-head__center">Gembloux</span>
    </header>
    <div class="stage" id="stage">
      <div class="frame" id="frame" tabindex="0" role="button" aria-label="Agrandir la carte en plein écran">
        <img class="page" id="cardImg"
             src="./carte-1.jpg" data-recto="./carte-1.jpg" data-verso="./carte-2.jpg"
             data-alt-base="Carte Fun Galaxy Gembloux" alt="Carte Fun Galaxy Gembloux — recto"
             width="2645" height="3742" decoding="async">
        <img class="page page--fx" id="cardImgFx" alt="" aria-hidden="true" decoding="async">
      </div>
    </div>
    <div class="bar">
      <nav class="seg" id="seg" data-face="0" aria-label="Recto ou verso">
        <span class="seg__thumb" aria-hidden="true"></span>
        <button type="button" class="seg__btn" aria-current="true">Recto</button>
        <button type="button" class="seg__btn" aria-current="false">Verso</button>
      </nav>
    </div>
  </div>

  <!-- Écran d'entrée -->
  <main class="entry" id="entry">
    <div class="entry__inner">
      <div class="entry__logo-wrap">
        <span class="entry__halo" aria-hidden="true"></span>
        <img class="entry__logo" src="../assets/logo-fun-galaxy.svg" alt="Fun Galaxy" width="320" height="217">
        <span class="entry__shine" aria-hidden="true"></span>
      </div>
      <p class="entry__center">Gembloux</p>
      <button type="button" class="btn-card" id="openCard">
        Voir la carte
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </main>

  <!-- Plein écran carte -->
  <div class="fs" id="fs" hidden aria-hidden="true" role="dialog" aria-label="Carte en plein écran">
    <img class="fs__img" id="fsImg" alt="" decoding="async">
    <button type="button" class="fs__close" id="fsClose" aria-label="Fermer le plein écran">&#10005;</button>
    <nav class="seg fs__seg" id="fsSeg" data-face="0" aria-label="Recto ou verso">
      <span class="seg__thumb" aria-hidden="true"></span>
      <button type="button" class="seg__btn" aria-current="true">Recto</button>
      <button type="button" class="seg__btn" aria-current="false">Verso</button>
    </nav>
  </div>

  <!-- Flash cinématique -->
  <div class="flash-el" aria-hidden="true"></div>

  <script src="../assets/intro-gl.js"></script>
  <script src="../assets/viewer.js"></script>
</body>
</html>
