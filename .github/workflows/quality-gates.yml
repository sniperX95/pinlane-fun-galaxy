name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ops-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic ops tests
        # Les gates navigateur (79 scripts Playwright) lisent
        # E2E_BROWSER_PATH ; sans elle ils cherchent Edge a un chemin
        # Windows et le runner Ubuntu echouait au premier gate depuis des
        # semaines. Le Chrome stable preinstalle des runners GitHub suffit.
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
        # Le lanceur (scripts/gates-lancer.js) joue TOUTE la suite, meme apres
        # un rouge, en parallele (une copie du depot et une plage de ports par
        # place), les gates sensibles au temps seuls a la fin. Deux chances :
        # les micro-budgets de perf/motion calibres machine locale varient sur
        # un runner partage ; un rouge se rejoue UNE fois, seul (vert au
        # second tour = INSTABLE, dit dans le bilan) ; un vrai rouge
        # deterministe echoue deux fois. Avant, `|| npm run test:ops:all`
        # rejouait toute la suite.
        run: npm run test:ops:all -- --deux-chances
        timeout-minutes: 90
